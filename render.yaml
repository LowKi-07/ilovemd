# Render blueprint - New > Blueprint in the Render dashboard, pick this repo.
# Secrets marked sync: false are asked for once, in the dashboard.
services:
  - type: web
    name: ilovemd
    runtime: node
    # A persistent disk needs a paid plan. On "free", drop the disk block and
    # ILOVEMD_DATA_DIR: visitors' saved files then reset on every deploy.
    plan: starter
    buildCommand: npm install
    startCommand: node server.mjs
    healthCheckPath: /healthz
    disk:
      name: ilovemd-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ILOVEMD_MODE
        value: public
      - key: HOST
        value: 0.0.0.0
      - key: ILOVEMD_DATA_DIR
        value: /var/data
      - key: ILOVEMD_AI_PROVIDER
        value: gemini
      - key: ILOVEMD_SESSION_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
