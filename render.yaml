# Render blueprint - New > Blueprint in the Render dashboard, pick this repo.
# Secrets marked sync: false are asked for once, in the dashboard.
services:
  - type: web
    name: ilovemd
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.mjs
    healthCheckPath: /login
    envVars:
      - key: ILOVEMD_MODE
        value: public
      - key: HOST
        value: 0.0.0.0
      - key: ILOVEMD_AI_PROVIDER
        value: gemini
      - key: ILOVEMD_SESSION_SECRET
        generateValue: true
      - key: ILOVEMD_GATE_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
