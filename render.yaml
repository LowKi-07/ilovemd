# Render blueprint - New > Blueprint in the Render dashboard, pick this repo.
# Secrets marked sync: false are asked for once, in the dashboard.
services:
  - type: web
    name: ilovemd
    runtime: node
    # Free: sleeps after 15 idle minutes, and visitors' saved files reset on
    # every deploy or restart (no persistent disk on free). To keep them,
    # switch to plan: starter and uncomment the disk block and ILOVEMD_DATA_DIR.
    plan: free
    buildCommand: npm install
    startCommand: node server.mjs
    healthCheckPath: /healthz
    # disk:
    #   name: ilovemd-data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: ILOVEMD_MODE
        value: public
      - key: HOST
        value: 0.0.0.0
      # - key: ILOVEMD_DATA_DIR
      #   value: /var/data
      - key: ILOVEMD_AI_PROVIDER
        value: gemini
      - key: ILOVEMD_SESSION_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
