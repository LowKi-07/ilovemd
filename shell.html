      var live = $('gen-live');
      if (live) live.textContent = 'Retrieving from Figma & writing… ' + secs + 's';
      $('valid').innerHTML = '<span style="color:var(--accent)">&#9679;</span> Retrieving from Figma & writing… ' + secs + 's';
    }, 500);

    var prevDoc = S.md;
    S.figError = null;
    try {
      var r = await post('/api/figma-doc', S.siteMode === 'public' ? { url: url, token: S.figmaToken } : { url: url }, true);
      clearInterval(tick);
      S.frameDocs[url] = r.markdown;
      S.qList = r.questions || [];
      S.before = prevDoc; S.pending = true; S.last = { fig: url };
      setDoc(r.markdown, (r.suggestedName || 'Figma component.md'));
      setStatus('dirty', '');
      say('a', '<b>Generated documentation</b> from the Figma frame in ' + Math.round(r.ms / 1000) + 's. Review it, tell me what to change, or press Download.');
      startQuestions(true);
      try {
        var st = await api('/api/state');
        S.frames = st.frames;
      } catch (e) { /* fine */ }
      paintSidebar();
    } catch (e) {
      clearInterval(tick);
      if (isAbort(e)) {
        say('a', 'Stopped.');
      } else {
        var p = e.payload || {};
        say('a', '<b>' + esc(p.error || "We couldn’t connect to Figma.") + '</b> ' + esc(p.explain || ''), true);
        // The chat is hidden on the landing card, so the card shows it too.
        S.figError = { title: p.error || e.message || "We couldn’t connect to Figma.", explain: p.explain || '' };
      }
      $('valid').innerHTML = '';
    }
    S.busy = false;
    paintTop(); paintEditor(); paintPreview(); paintChat();
  }
  function openFrame(url) {
    stash();
    S.q = null; S.qList = null;
    S.curFrame = url;
    var f = S.frames.find(function (x) { return x.url === url; });
    var existing = S.frameDocs[url] || '';
    S.before = null; S.pending = false;
    setDoc(existing, f ? f.name : 'Figma component');
    if (!existing) {
      say('a', 'No generated Markdown is kept for <b>' + esc(f ? f.name : url) + '</b> in this session. ' +
        'Ask me to regenerate it, or paste the link again.');
      // Prefill the drop box for one-click regeneration.
      paintEditor();
      S.figUrlDraft = url;
      var u = $('figurl');
      if (u) u.value = url;
    }
    setStatus('', '');
    paintSidebar();
  }

  /* ============================================================= convert */
  function convertFile() {
    if (S.busy) return;
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = CONVERT_ACCEPT[new URLSearchParams(location.search).get('type')] || CONVERT_ACCEPT.file;
    inp.onchange = function () {
      if (inp.files && inp.files[0]) uploadAndConvert(inp.files[0]);
    };
    inp.click();
  }
  async function uploadAndConvert(f) {
    if (S.busy) return;
    S.curName = f.name;
    S.current = 'upload';
    S.busy = true;
    paintTop(); paintEditor();
    var t0 = Date.now();
    var tick = setInterval(function () {
      var live = $('gen-live');
      if (live) live.textContent = 'Converting… ' + Math.round((Date.now() - t0) / 1000) + 's';
    }, 500);

    try {
      var up = await fetch('/api/upload?name=' + encodeURIComponent(f.name), { method: 'POST', body: f });
      var uj = null;
      try { uj = await up.json(); } catch (e2) { /* non-JSON */ }
      if (!up.ok) {
        var ue = new Error((uj && uj.error) || 'upload failed');
        ue.payload = uj || {};
        throw ue;
      }
      var r = await post('/api/convert', { path: uj.path }, true);
      clearInterval(tick);
      S.view = 'split';
      S.before = null; S.pending = false;
      setDoc(r.markdown, (r.suggestedName || S.curName).replace(/\.md$/i, '').replace(/\.[a-z0-9]+$/i, ''));
      setStatus('', '');
      toast('Converted ' + S.curName + ' in ' + Math.round(r.ms / 1000) + 's');
    } catch (e) {
      clearInterval(tick);
      S.current = null; S.curName = '';
      if (isAbort(e)) toast('Conversion stopped');
      else {
        var p = e.payload || {};
        notify('error', 'Could not convert that file.', p.explain || e.message);
      }
    }
    S.busy = false;
    paintTop(); paintEditor(); validate();
  }

  /* ============================================================ chat send */
  /* ------------------------------------------------------- attachments
     "+ Add" uploads photos and files straight away (POST /api/upload) and
     lists them above the pills; the next message sends their paths, and the
     server turns documents into text context and hands photos to the AI. */
  var ATTACH_MAX = 5, ATTACH_IMG = /\.(png|jpe?g|webp|gif)$/i;
  function fmtSize(n) { return n < 1024 * 1024 ? Math.max(1, Math.round(n / 1024)) + ' KB' : (n / 1048576).toFixed(1) + ' MB'; }
  function paintAttach() {
    var el = $('attach');
    el.hidden = !S.attach.length;
    el.innerHTML = S.attach.map(function (a) {
      return '<span class="afile' + (a.up ? ' is-up' : '') + '" title="' + esc(a.name) + '">' +
        '<span aria-hidden="true">' + (a.image ? '&#128444;' : '&#128206;') + '</span>' +
        '<span class="afile__n">' + esc(a.name) + '</span>' +
        '<span class="afile__s">' + (a.up ? 'uploading…' : fmtSize(a.size)) + '</span>' +
        '<button data-rm="' + a.id + '" aria-label="Remove ' + esc(a.name) + '"' + (S.busy ? ' disabled' : '') + '>&times;</button></span>';
    }).join('');
    Array.prototype.forEach.call(el.querySelectorAll('[data-rm]'), function (b) {
      b.onclick = function () {
        var id = Number(b.getAttribute('data-rm'));
        S.attach = S.attach.filter(function (a) { return a.id !== id; });
        paintAttach();
      };
    });
  }
  $('attach-input').addEventListener('change', async function () {
    var files = Array.prototype.slice.call(this.files || []);
    this.value = '';
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      if (S.attach.length >= ATTACH_MAX) { notify('warn', 'Up to ' + ATTACH_MAX + ' files per message.', 'Remove one to add another.'); break; }
      var image = ATTACH_IMG.test(f.name);
      if (f.size > (image ? 10e6 : 30e6)) { notify('warn', f.name + ' is too large.', image ? 'Photos can be up to 10 MB.' : 'Files can be up to 30 MB.'); continue; }
      var item = { id: Date.now() + i, name: f.name, size: f.size, image: image, path: '', up: true };
      S.attach.push(item);
      paintAttach();
      try {
        var res = await fetch('/api/upload?name=' + encodeURIComponent(f.name), { method: 'POST', body: f });
        var j = await res.json().catch(function () { return {}; });
        if (!res.ok) throw new Error(j.error || 'upload failed');
        item.path = j.path; item.up = false;
      } catch (e) {
        S.attach = S.attach.filter(function (a) { return a !== item; });
        notify('error', 'Could not attach ' + f.name + '.', e.message);
      }
      paintAttach();
    }
    $('prompt').focus();
  });

  async function send(asking) {
    if (S.busy) return;
    var instruction = $('prompt').value.trim();
    if (!instruction) return;
    if (S.attach.some(function (a) { return a.up; })) { toast('Wait for the attachments to finish uploading'); return; }
    var sent = MODE === 'text' ? S.attach.slice() : [];
    $('prompt').value = '';
    $('prompt').style.height = 'auto';

    // No document yet: in text mode that means "write one"; elsewhere, point at the entry step.
    if (!S.md && MODE !== 'text') {
      say('u', instruction);
      say('a', MODE === 'ui'
        ? 'Generate documentation first - choose a folder, pick a component, then press <b>Generate Documentation</b>.'
        : 'Paste a Figma frame link in the main panel and press <b>Fetch &amp; Generate</b> first.');
      return;
    }

    S.busy = true; S.last = { instruction: instruction, asking: !!asking };
    // User messages are shown as plain text, so the attachments ride along as text too.
    say('u', instruction + (sent.length
      ? '\n' + sent.map(function (a) { return (a.image ? '\uD83D\uDDBC ' : '\uD83D\uDCCE ') + a.name; }).join('  ·  ')
      : ''));
    paintAttach();
    if (!S.pending) S.before = S.md;
    paintTop(); paintChips();

    var t0 = Date.now();
    var tick = setInterval(function () {
      $('valid').innerHTML = '<span style="color:var(--accent)">&#9679;</span> ' + aiName() + ' is ' +
        (asking ? 'answering' : 'writing') + '… ' + Math.round((Date.now() - t0) / 1000) + 's';
    }, 500);

    try {
      var body = {
        instruction: instruction,
        mode: asking ? 'ask' : (S.md ? 'edit' : 'new'),
        markdown: S.md,
        attachments: sent.map(function (a) { return a.path; }),
      };
      var r = await post('/api/ai', body, true);
      clearInterval(tick);
      // Delivered: the files belonged to that message.
      if (sent.length) S.attach = S.attach.filter(function (a) { return sent.indexOf(a) === -1; });

      if (asking) {
        say('a', md(r.answer || '(no answer)'));
      } else if (!r.markdown || !r.markdown.trim()) {
        S.md = S.before || '';
        say('a', aiName() + ' returned nothing. Your text is unchanged.', true);
      } else {
        var wasNew = body.mode === 'new';
        S.md = r.markdown;
        stash();
        S.pending = true; S.dirty = true;
        if (wasNew && MODE === 'text' && r.suggestedName) {
          S.docName = null; S.mtime = 0;
          $('title').value = r.suggestedName;
        }
        if (r.questions && r.questions.length) S.qList = r.questions;
        setStatus('dirty', '');
        paintEditor(); paintPreview();
        say('a', '<b>' + (wasNew ? 'Wrote the document' : 'Updated the document') + '</b> in ' +
          Math.round((Date.now() - t0) / 1000) + 's - review the editor, then <b>Keep</b> or <b>Discard</b>.');
      }
    } catch (e) {
      clearInterval(tick);
      if (S.before != null && !S.pending) { S.md = S.before; paintEditor(); paintPreview(); }
      if (isAbort(e)) {
        say('a', 'Stopped. Your text is unchanged.');
      } else {
        var p = e.payload || {};
        say('a', '<b>' + aiName() + ' could not do that.</b> ' + esc(p.explain || e.message), true);
      }
      S.pending = false;
    }
    S.busy = false;
    validate(); paintTop(); paintChat(); paintAttach();
  }

  function keep() {
    S.pending = false; S.before = null;
    paintChat(); paintTop();
    save();
  }
  function discard() {
    if (S.before == null) return;
    S.md = S.before;
    stash();
    S.before = null; S.pending = false; S.dirty = true; S.q = null; S.qList = null;
    setStatus('dirty', '');
    paintEditor(); paintPreview(); validate(); paintChat(); paintTop();
    say('a', 'Discarded. Your previous text is back.');
  }
  function regen() {
    if (!S.last) return;
    if (S.last.gen) return generate();
    if (S.last.figDemo) return figGenerateDemo();
    if (S.last.figHow) return figDemoGenerate();
    if (S.last.fig) return figGenerate(S.last.fig);
    $('prompt').value = S.last.instruction;
    send(S.last.asking);
  }

  /* ================================================================ save */
  function downloadMd() {
    if (!S.md) return;
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([S.md], { type: 'text/markdown' }));
    a.download = currentName() || 'document.md';
    a.click();
    URL.revokeObjectURL(a.href);
    S.dirty = false;
    setStatus('', 'downloaded');
    toast('Downloaded ' + (currentName() || 'document.md'));
  }
  function save() {
    downloadMd();
  }

  /* ============================================================== events */
  $('btn-chat').onclick = function () { S.chat = !S.chat; paintTop(); };
  function closeSheet() { S.chat = false; paintTop(); $('btn-chat').focus(); }
  $('btn-chat-x').onclick = closeSheet;
  $('sheet-scrim').onclick = closeSheet;
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && S.chat && window.matchMedia('(max-width: 940px)').matches) closeSheet();
  });
  $('viewmode').addEventListener('click', function (e) {
    var b = e.target.closest('[data-v]');
    if (!b || b.hidden) return;
    S.view = b.getAttribute('data-v');
    paintTop();
  });
  $('btn-save').onclick = save;
  $('btn-copy').onclick = function () {
    navigator.clipboard.writeText(S.md).then(
      function () { toast('Markdown copied'); },
      function () { toast('Copy failed - copy from the editor'); }
    );
  };
  $('btn-send').onclick = function () {
    if (S.busy) { if (S.ctrl) S.ctrl.abort(); return; }
    send(false);
  };
  $('prompt').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(false); }
  });
  $('prompt').addEventListener('input', function () {
    var p = $('prompt');
    p.style.height = 'auto';
    var h = Math.max(21, Math.min(180, p.scrollHeight));
    p.style.height = h + 'px';
    p.dataset.tall = h > 34 ? '1' : '';
  });
  $('title').addEventListener('input', function () {
    S.dirty = true;
    setStatus('dirty', '');
    var t = $('title');
    sizeTitle(t);
  });
  document.addEventListener('keydown', function (e) {
    var mod = e.metaKey || e.ctrlKey;
    if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
    if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); S.chat = true; paintTop(); $('prompt').focus(); }
    if (e.key === 'Escape' && S.qBig) { S.qBig = false; paintChat(); return; }
    if (e.key === 'Escape' && S.side) { S.side = false; paintTop(); }
  });
  // The sidebar is transient: any click outside it (or its hamburger) closes it.
  document.addEventListener('pointerdown', function (e) {
    if (!S.side) return;
    if (e.target.closest('.side')) return;
    S.side = false;
    paintTop();
  });
  window.addEventListener('beforeunload', function (e) {
    if (S.dirty && S.md) { e.preventDefault(); e.returnValue = ''; }
  });

  /* ================================================================ boot */
  (async function () {
    document.title = 'ilovemd · ' + TAGS[MODE].replace(' → ', ' → ');
    paintTop(); paintSidebar(); paintEditor(); paintPreview(); paintChat();

    try {
      var setup = await api('/api/setup');
      S.siteMode = setup.mode;
      S.figmaDemo = setup.figmaDemo;
      S.aiLabel = setup.ai && setup.ai.label;
      S.gate = !!setup.gate;
    } catch (e) { S.siteMode = 'local'; }
    if (S.gate) {
      if (window.ilovemdNav) window.ilovemdNav.showLogout(function () {
        api('/api/logout', { method: 'POST' }).catch(function () {}).then(function () { location.href = '/login'; });
      });
    }

    try {
      var st = await api('/api/state');
      S.importDir = st.importDir;
      S.frames = st.frames || [];
    } catch (e) { /* fine */ }

    if (MODE === 'text') {
      // Start blank: recent documents live in the sidebar, not in the editor.
      await loadDocs();
      setStatus('', '');
      // "Use template" on the templates page lands here with ?template=.
      var tpl = new URLSearchParams(location.search).get('template');
      if (tpl) {
        try {
          var t = await api('/api/template?slug=' + encodeURIComponent(tpl));
          setDoc(t.markdown, t.slug + '.md');
          say('a', 'Loaded the <b>' + esc(t.title) + '</b> template. Edit it directly, or tell me what to fill in.');
        } catch (e) { notify('warn', 'That template could not be loaded.', 'Start from a blank page, or pick it again from Templates.'); }
        history.replaceState(null, '', location.pathname);
      }
      // Nothing names the file in this mode, so seed it - it is what the
      // download is called, and it is editable in place.
      if (!$('title').value.trim()) $('title').value = 'untitled.md';
      paintTop();
    } else if (MODE === 'ui') {
      await loadKits();
      await loadComponents();
    } else {
      paintSidebar();
      paintEditor(); // siteMode just resolved - repaints the figma tab correctly
    }
    paintTop();
  })();
})();
</script>
<script src="/nav.js"></script>
</body>
</html>
