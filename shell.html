<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ilovemd</title>
<style>
  /* ------------------------------------------------------------ tokens
     Identical across every ilovemd page. */
  :root {
    --canvas: #08080c;
    --panel: rgba(255,255,255,.038);
    --panel-raised: rgba(255,255,255,.062);
    --panel-solid: #12121a;
    --hairline: rgba(255,255,255,.085);
    --hairline-strong: rgba(255,255,255,.16);
    --text: #f5f5fa;
    --text-2: #a3a3b4;
    --text-3: #6d6d7e;
    --accent: #8b7cff;
    --accent-soft: rgba(139,124,255,.16);
    --accent-2: #3fd0e0;
    --primary: #4f46e5;
    --primary-hov: #4338ca;
    --gradient: linear-gradient(135deg,#8b7cff 0%,#6f8bff 45%,#3fd0e0 100%);
    --ok: #34d399;
    --warn: #fbbf24;
    --danger: #fb7185;
    --r-sm: 8px; --r-md: 12px; --r-lg: 18px; --r-pill: 999px;
    --blur: saturate(180%) blur(16px);
    --ease: cubic-bezier(.2,.8,.3,1);
    --font: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
    --side: 244px;
    --chat: 320px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--canvas); color: var(--text);
    font: 400 15px/1.6 var(--font);
    overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(52em 34em at 8% -6%, rgba(139,124,255,.17), transparent 62%),
      radial-gradient(46em 30em at 102% 104%, rgba(63,208,224,.11), transparent 60%);
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,.11); border-radius: var(--r-pill);
    border: 2px solid transparent; background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.2); background-clip: padding-box; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ------------------------------------------------------------ buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 10px;
    border: 1px solid transparent; background: transparent;
    color: var(--text); font: 560 13px var(--font);
    cursor: pointer; white-space: nowrap; text-decoration: none;
    transition: transform .16s var(--ease), background-color .16s var(--ease);
  }
  .btn:hover:not(:disabled) { transform: translateY(-1px); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn--stroke { border-color: var(--hairline-strong); background: var(--panel); }
  .btn--stroke:hover:not(:disabled) { background: var(--panel-raised); }
  .btn--ghost { color: var(--text-2); }
  .btn--ghost:hover:not(:disabled) { background: var(--panel); color: var(--text); }
  .btn--primary { background: var(--primary); color: #fff; font-weight: 620; }
  .btn--primary:hover:not(:disabled) { background: var(--primary-hov); }
  .btn--sm { padding: 5px 10px; font-size: 12.5px; }

  .mode {
    display: inline-flex; border: 1px solid var(--hairline);
    border-radius: var(--r-pill); overflow: hidden; flex: none;
  }
  .mode button {
    border: 0; background: transparent; color: var(--text-3);
    font: 500 11px var(--font); padding: 4px 11px; cursor: pointer;
  }
  .mode button[aria-pressed="true"] { background: var(--accent-soft); color: var(--text); }

  /* -------------------------------------------------------------- topbar */
  .top {
    position: fixed; top: 0; left: 0; right: 0; height: 52px; z-index: 10;
    display: flex; align-items: center; gap: 10px; padding: 0 12px;
    border-bottom: 1px solid var(--hairline);
    background: rgba(10,10,16,.62);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  }
  .burger {
    width: 32px; height: 32px; border: 0; background: none; color: var(--text-2);
    border-radius: 8px; cursor: pointer; font-size: 15px; display: grid; place-items: center;
  }
  .burger:hover { background: var(--panel); color: var(--text); }
  .burger[aria-pressed="true"] { background: var(--accent-soft); color: var(--text); }
  .brandname { font-size: 15px; font-weight: 660; letter-spacing: -.015em; color: var(--text); text-decoration: none; }
  .modetag {
    font: 600 10px var(--mono); letter-spacing: .06em; color: var(--accent-2);
    border: 1px solid rgba(63,208,224,.3); background: rgba(63,208,224,.1);
    border-radius: var(--r-sm); padding: 2px 7px; white-space: nowrap;
  }
  #title {
    font: 620 14px var(--font); letter-spacing: -.01em;
    background: transparent; border: 1px solid transparent; border-radius: 8px;
    color: var(--text); padding: 4px 8px; min-width: 8ch; max-width: 30ch;
  }
  #title:hover { border-color: var(--hairline); }
  #title:focus { border-color: rgba(139,124,255,.6); outline: none; background: var(--panel); }
  #title[readonly] { border-color: transparent; background: transparent; cursor: default; }
  #title[readonly]:hover { border-color: transparent; }
  .status { font: 400 11px var(--mono); color: var(--text-3); white-space: nowrap; }
  .sp { flex: 1 1 auto; min-width: 0; }

  /* --------------------------------------------------------------- shell */
  .shell { position: fixed; inset: 52px 0 0 0; z-index: 1; display: flex; }
  .panel { min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .phead {
    flex: none; display: flex; align-items: center; gap: 8px;
    height: 36px; padding: 0 14px;
    border-bottom: 1px solid var(--hairline);
    background: rgba(10,10,16,.4);
  }
  .phead .lbl {
    font: 600 10.5px var(--font); letter-spacing: .09em;
    text-transform: uppercase; color: var(--text-3); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .pbody { flex: 1; min-height: 0; overflow: auto; }

  /* -------------------------------------------------------------- sidebar
     A transient overlay: closed by default, opened by the hamburger, closed
     again by any click outside it. It floats over the panels rather than
     pushing them around. */
  .side {
    position: fixed; top: 52px; left: 0; bottom: 0; z-index: 25;
    width: var(--side); max-width: 86vw;
    border-right: 1px solid var(--hairline); background: var(--panel-solid);
    box-shadow: 18px 0 50px rgba(0,0,0,.45);
    display: flex; flex-direction: column; overflow: hidden;
    transform: translateX(-100%);
    transition: transform .18s var(--ease);
  }
  .shell[data-side="open"] .side { transform: translateX(0); }
  .side .inner { width: var(--side); max-width: 86vw; display: flex; flex-direction: column; height: 100%; }
  .searchwrap { flex: none; padding: 10px 10px 6px; }
  input[type=search], .side input[type=text] {
    width: 100%; font: 400 13px var(--font); color: var(--text);
    background: var(--panel); border: 1px solid var(--hairline);
    border-radius: 10px; padding: 7px 10px; appearance: none;
  }
  input:focus { border-color: rgba(139,124,255,.6); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
  .list { flex: 1; min-height: 0; overflow: auto; padding: 4px 8px 20px; }
  .item {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: none; border: 0; color: var(--text);
    padding: 8px 10px; border-radius: 10px; margin-bottom: 2px; position: relative;
  }
  .item:hover { background: var(--panel); }
  .item[aria-current="true"] { background: var(--accent-soft); }
  .item[aria-current="true"]::before {
    content: ''; position: absolute; left: 2px; top: 9px; bottom: 9px;
    width: 2px; border-radius: 2px; background: var(--accent);
  }
  .item__t {
    font-size: 13.5px; font-weight: 540; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .item__m { font: 400 11px var(--mono); color: var(--text-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item__dot { position: absolute; right: 10px; top: 12px; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
  .item__st {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    width: 15px; height: 15px; border-radius: 50%; flex: none;
    display: grid; place-items: center; font: 700 9px var(--font);
  }
  .item__st--ok { background: rgba(52,211,153,.15); color: var(--ok); border: 1px solid rgba(52,211,153,.4); }
  .item__st--todo { border: 1.5px solid var(--hairline-strong); }
  .kitwrap { padding: 10px 10px 2px; position: relative; }
  .kitsel {
    width: 100%; font: 560 13px var(--font); color: var(--text);
    background-color: var(--panel);
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%23a3a3b4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>');
    background-repeat: no-repeat; background-position: right 12px center; background-size: 16px 16px;
    border: 1px solid var(--hairline);
    border-radius: 10px; padding: 9px 36px 9px 12px;
    appearance: none; -webkit-appearance: none; cursor: pointer;
  }
  .kitsel:hover { border-color: var(--hairline-strong); }
  .kitsel:focus { border-color: rgba(139,124,255,.6); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
  .kitsel option { background: var(--panel-solid); color: var(--text); }
  .empty { color: var(--text-3); font-size: 12.5px; padding: 12px 14px; line-height: 1.55; }
  .ghead {
    font: 600 10px var(--font); letter-spacing: .1em; text-transform: uppercase;
    color: var(--text-3); padding: 12px 10px 4px;
  }
  .sidefoot { flex: none; border-top: 1px solid var(--hairline); padding: 9px 10px; display: flex; gap: 6px; align-items: center; }
  .importbox {
    margin: 12px 10px; padding: 22px 14px; text-align: center;
    border: 1px dashed var(--hairline-strong); border-radius: var(--r-md);
    background: var(--panel);
  }
  .importbox h3 { margin: 0 0 6px; font-size: 13.5px; font-weight: 620; }
  .importbox p { margin: 0 0 14px; font-size: 12px; color: var(--text-2); line-height: 1.5; }
  .importbox .hint { margin: 10px 0 0; font: 400 10px var(--mono); color: var(--text-3); }
  .folder {
    margin: 10px 10px 2px; padding: 7px 9px;
    border: 1px solid var(--hairline); border-radius: 10px; background: var(--panel);
    display: flex; align-items: center; gap: 7px;
  }
  .folder__path {
    flex: 1; min-width: 0; font: 400 10.5px var(--mono); color: var(--text-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left;
  }

  /* ----------------------------------------------------------------- main */
  .main { flex: 1; min-width: 0; display: flex; }
  .editor, .preview { flex: 1; border-right: 1px solid var(--hairline); }
  .preview { background: rgba(255,255,255,.012); }
  .shell[data-view="edit"] .preview { display: none; }
  .shell[data-view="preview"] .editor { display: none; }
  /* Before anything is generated there is nothing to preview and nothing to
     discuss - the markdown panel is the whole stage. */
  .shell[data-noprev="1"] .preview { display: none; }
  .shell[data-noprev="1"] .editor .phead { display: none; }
  .shell[data-nochat="1"] .chat { display: none !important; }

  #ed {
    flex: 1; width: 100%; min-height: 0; resize: none; display: block;
    font: 400 13px/1.75 var(--mono); color: #dcdce6;
    background: transparent; border: 0; padding: 18px 20px 40px;
    tab-size: 2; caret-color: var(--accent-2);
  }
  #ed:focus { outline: none; }
  #ed::placeholder { color: var(--text-3); }
  #ed::selection { background: rgba(139,124,255,.32); }

  .placeholder {
    height: 100%; flex: 1; display: grid; place-items: center; text-align: center;
    color: var(--text-3); font-size: 13px; padding: 30px;
  }
  .placeholder .big { font-size: 26px; margin-bottom: 10px; opacity: .6; }
  /* Glassmorphic, matching the tool cards on the homepage: diagonal purple
     lighting from the top-left falling away to near-black. */
  .dropbox {
    position: relative; overflow: hidden;
    border: 1px solid rgba(139,124,255,.09);
    background:
      linear-gradient(135deg,
        rgba(139,124,255,.065) 0%,
        rgba(111,139,255,.025) 40%,
        rgba(8,8,16,.55) 100%);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border-radius: var(--r-lg); padding: 34px 30px; max-width: 420px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.05),
      inset 1px 0 0 rgba(255,255,255,.025),
      0 4px 24px rgba(0,0,0,.28);
  }
  .dropbox::before {
    content: ''; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background: linear-gradient(135deg,
      rgba(255,255,255,.04) 0%,
      rgba(139,124,255,.02) 30%,
      transparent 55%);
  }
  /* Children sit above the lighting overlay. */
  .dropbox > * { position: relative; z-index: 1; }
  .dropbox--bare {
    border-color: transparent; background: transparent;
    backdrop-filter: none; -webkit-backdrop-filter: none; box-shadow: none;
  }
  .dropbox--bare::before { display: none; }
  /* Back on the left, the primary action on the right. The preceding <p>
     already carries a 16px bottom margin, so only a little is needed here. */
  .dropbox__actions {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-top: 2px;
  }
  .ftile {
    width: 58px; height: 58px; border-radius: 15px;
    display: grid; place-items: center;
    background: var(--tb, rgba(255,255,255,.05));
    border: 1px solid var(--tl, var(--hairline));
  }
  .ftile svg { width: 30px; height: 30px; display: block; }
  .fpair { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 18px; }
  .fpair .arr { color: var(--text-3); font-size: 18px; }
  .loader {
    width: 34px; height: 34px; margin: 0 auto 18px; border-radius: 50%;
    border: 3px solid var(--hairline-strong); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .dropbox h3 { margin: 0 0 6px; font-size: 15px; font-weight: 620; color: var(--text); }
  .dropbox p { margin: 0 0 16px; font-size: 12.5px; color: var(--text-2); line-height: 1.55; }
  .dropbox input {
    width: 100%; font: 400 12px var(--mono); color: var(--text);
    background: rgba(0,0,0,.3); border: 1px solid var(--hairline);
    border-radius: 10px; padding: 9px 11px; margin-bottom: 12px;
  }

  .code {
    margin: 0; padding: 18px 20px 40px;
    font: 400 12.5px/1.7 var(--mono); color: #dcdce6;
    white-space: pre; overflow: auto; min-height: 100%;
  }
  .tabs { display: flex; gap: 4px; min-width: 0; overflow-x: auto; }
  .tab {
    border: 1px solid var(--hairline); background: var(--panel);
    color: var(--text-2); border-radius: var(--r-pill);
    padding: 2px 10px; font: 500 10.5px var(--mono); cursor: pointer; white-space: nowrap;
  }
  .tab[aria-pressed="true"] { background: var(--accent-soft); color: var(--text); border-color: rgba(139,124,255,.55); }
  .genbar {
    flex: none; border-top: 1px solid var(--hairline);
    background: rgba(10,10,16,.66);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    padding: 9px 14px; display: flex; align-items: center; gap: 10px;
  }
  .genstatus { flex: 1; min-width: 0; font: 400 11.5px var(--mono); color: var(--text-2); }
  .genstatus .tick { color: var(--ok); }
  .genstatus .doing { color: var(--accent); }

  /* markdown preview */
  .md { padding: 22px 26px 60px; max-width: 78ch; }
  .md > :first-child { margin-top: 0; }
  .md h1 { font-size: 24px; margin: 0 0 10px; letter-spacing: -.02em; }
  .md h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--text-3); margin: 28px 0 10px; padding-bottom: 6px;
    border-bottom: 1px solid var(--hairline); font-weight: 650;
  }
  .md h3 { font-size: 15px; margin: 20px 0 6px; }
  .md p { margin: 0 0 11px; }
  .md ul, .md ol { margin: 0 0 12px; padding-left: 22px; }
  .md li { margin: 3px 0; }
  .md hr { border: 0; border-top: 1px solid var(--hairline); margin: 24px 0; }
  .md blockquote {
    margin: 0 0 12px; padding: 9px 13px; border-left: 3px solid var(--hairline-strong);
    background: var(--panel); border-radius: 0 8px 8px 0; color: var(--text-2);
  }
  .md blockquote p:last-child { margin: 0; }
  .md code {
    font: 400 12.5px var(--mono); background: rgba(255,255,255,.06);
    padding: 2px 5px; border-radius: 5px; word-break: break-word;
  }
  .md pre {
    background: rgba(0,0,0,.35); border: 1px solid var(--hairline);
    border-radius: 10px; padding: 13px 15px; overflow-x: auto; margin: 0 0 13px;
  }
  .md pre code { background: none; padding: 0; font-size: 12px; white-space: pre; }
  .tablewrap { overflow-x: auto; margin: 0 0 14px; border: 1px solid var(--hairline); border-radius: 10px; }
  .md table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .md th, .md td { text-align: left; padding: 7px 11px; border-bottom: 1px solid var(--hairline); vertical-align: top; }
  .md th {
    background: var(--panel); font: 600 10.5px var(--font);
    text-transform: uppercase; letter-spacing: .05em; color: var(--text-2); white-space: nowrap;
  }
  .md tbody tr:last-child td { border-bottom: 0; }
  .md img { max-width: 100%; }

  /* ----------------------------------------------------------------- chat */
  .chat {
    flex: none; width: var(--chat);
    border-left: 1px solid var(--hairline); background: rgba(255,255,255,.012);
    display: flex; flex-direction: column; overflow: hidden;
    transition: width .18s var(--ease), opacity .18s var(--ease);
  }
  .shell[data-chat="closed"] .chat { width: 0; opacity: 0; pointer-events: none; border-left: 0; }
  .chat .inner { width: var(--chat); display: flex; flex-direction: column; height: 100%; }
  .msgs { flex: 1; min-height: 0; overflow: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 92%; border-radius: 12px; padding: 8px 12px; font-size: 13px; line-height: 1.55; }
  .msg--u { align-self: flex-end; background: var(--accent-soft); border: 1px solid rgba(139,124,255,.3); }
  .msg--a { align-self: flex-start; background: var(--panel); border: 1px solid var(--hairline); color: var(--text-2); }
  .msg--a b { color: var(--text); font-weight: 620; }
  .msg--err { border-color: rgba(251,113,133,.4); background: rgba(251,113,133,.08); }
  .msg .when { display: block; font: 400 10px var(--mono); color: var(--text-3); margin-top: 4px; }
  .chatempty { color: var(--text-3); font-size: 12.5px; text-align: center; margin: auto 10px; line-height: 1.6; }
  .pacts { display: flex; gap: 2px; align-self: flex-start; margin: -4px 0 0 2px; }
  .ibtn {
    width: 30px; height: 30px; border: 0; background: none; border-radius: 8px;
    color: var(--text-3); cursor: pointer; display: grid; place-items: center;
    transition: background-color .16s var(--ease), color .16s var(--ease);
  }
  .ibtn:hover { background: var(--panel-raised); color: var(--text); }
  .ibtn svg { width: 16px; height: 16px; display: block; }

  /* clarifications card, styled after Claude's own question panel */
  .qcard__bar { display: flex; align-items: center; gap: 4px; }
  .qcard__title {
    font: 600 10.5px var(--font); letter-spacing: .1em; text-transform: uppercase;
    color: var(--text-3);
  }
  .qcard__bar .ibtn { width: 24px; height: 24px; }
  .qcard__bar .ibtn svg { width: 13px; height: 13px; }
  .qoverlay {
    position: fixed; inset: 0; z-index: 80; padding: 24px;
    background: rgba(5,5,10,.62);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    display: grid; place-items: center;
  }
  .qoverlay .qcard { align-self: center; justify-self: center; }
  .qcard--big {
    width: min(680px, 94vw); max-height: 86vh; overflow: auto;
    padding: 20px 22px; gap: 11px;
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
  }
  .qcard--big .qcard__q { font-size: 15.5px; }
  .qcard--big .qcard__n { font-size: 11px; }
  .qcard--big .qopt { padding: 12px 14px; font-size: 13.5px; border-radius: 12px; }
  .qcard--big input { padding: 11px 12px; font-size: 13.5px; }
  .qcard {
    align-self: stretch; display: flex; flex-direction: column; gap: 7px;
    border: 1px solid var(--hairline-strong); background: var(--panel-solid);
    border-radius: var(--r-md); padding: 11px;
  }
  .qcard__head { display: flex; gap: 8px; align-items: flex-start; }
  .qcard__n {
    flex: none; font: 600 10px var(--mono); color: var(--warn);
    border: 1px solid rgba(251,191,36,.35); border-radius: 6px; padding: 2px 6px; margin-top: 1px;
  }
  .qcard__q { flex: 1; min-width: 0; font: 600 12.5px var(--font); line-height: 1.5; }
  .qcard__head .ibtn { width: 22px; height: 22px; margin: -2px -2px 0 0; }
  .qopt {
    text-align: left; display: flex; align-items: baseline; gap: 8px;
    border: 1px solid var(--hairline); background: var(--panel);
    border-radius: 10px; padding: 8px 10px; cursor: pointer;
    color: var(--text-2); font: 400 12.5px/1.45 var(--font);
    transition: border-color .16s var(--ease), background-color .16s var(--ease), color .16s var(--ease);
  }
  .qopt:hover { border-color: rgba(139,124,255,.55); background: var(--accent-soft); color: var(--text); }
  .qopt__k {
    margin-left: auto; flex: none; font: 600 10px var(--mono); color: var(--text-3);
    border: 1px solid var(--hairline); border-radius: 5px; padding: 1px 5px;
  }
  .qcard input {
    width: 100%; font: 400 12.5px var(--font); color: var(--text);
    background: rgba(0,0,0,.3); border: 1px solid var(--hairline);
    border-radius: 8px; padding: 8px 10px;
  }
  .qcard__foot { display: flex; gap: 6px; align-items: center; margin-top: 2px; }
  .chatfoot {
    flex: none; border-top: 1px solid var(--hairline);
    background: rgba(10,10,16,.66);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    padding: 9px 10px 10px; display: flex; flex-direction: column; gap: 7px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip {
    border: 1px solid var(--hairline); background: var(--panel);
    color: var(--text-2); border-radius: var(--r-pill);
    padding: 3px 10px; font: 500 11px var(--font); cursor: pointer;
    transition: color .16s var(--ease), border-color .16s var(--ease), background-color .16s var(--ease);
  }
  .chip:hover:not(:disabled) { color: var(--text); border-color: rgba(139,124,255,.55); background: var(--accent-soft); }
  .chip:disabled { opacity: .4; cursor: default; }
  .prow {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--hairline-strong); background: rgba(255,255,255,.05);
    border-radius: var(--r-md); padding: 7px 7px 7px 12px;
    transition: border-color .16s var(--ease), box-shadow .16s var(--ease);
  }
  .prow:focus-within { border-color: rgba(139,124,255,.6); box-shadow: 0 0 0 3px var(--accent-soft); }
  .spark { color: var(--accent); font-size: 13px; line-height: 21px; flex: none; }
  #prompt {
    flex: 1; min-width: 0; border: 0; outline: none; resize: none;
    background: transparent; color: var(--text);
    font: 400 13.5px/1.55 var(--font); padding: 0; max-height: 180px;
    min-height: 21px;
  }
  /* Multi-line typing pins the icons back to the bottom row. */
  .prow:has(#prompt[data-tall="1"]) { align-items: flex-end; }
  .prow:has(#prompt[data-tall="1"]) .spark { align-self: flex-start; }
  .sendbtn {
    flex: none; width: 32px; height: 32px; border: 0; border-radius: 10px;
    background: var(--primary); color: #fff; cursor: pointer;
    display: grid; place-items: center;
    transition: transform .16s var(--ease), opacity .16s var(--ease);
  }
  .sendbtn:hover:not(:disabled) { transform: translateY(-1px); background: var(--primary-hov); }
  .sendbtn:disabled { opacity: .35; cursor: default; }
  .sendbtn svg { width: 16px; height: 16px; display: block; }
  .sendbtn--stop {
    background: transparent; color: var(--text-2);
    border: 1px solid var(--hairline-strong);
  }
  .sendbtn--stop:hover { color: var(--text); background: var(--panel); }
  #prompt::placeholder { color: var(--text-3); }
  .valid { font: 400 10.5px var(--mono); color: var(--text-3); min-height: 14px; }
  .valid .v-ok { color: var(--ok); }
  .valid .v-warn { color: var(--warn); }

  /* ---------------------------------------------------------------- misc */
  .notice { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); z-index: 40; width: min(560px, 92vw); }
  .note {
    margin: 0; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--hairline); background: var(--panel-solid);
    font-size: 12.5px; color: var(--text-2);
    display: flex; gap: 10px; align-items: flex-start;
    box-shadow: 0 14px 40px rgba(0,0,0,.5);
  }
  .note--warn { border-color: rgba(251,191,36,.4); }
  .note--error { border-color: rgba(251,113,133,.4); }
  .note b { color: var(--text); font-weight: 620; }
  .note__x { margin-left: auto; background: none; border: 0; color: var(--text-3); cursor: pointer; font-size: 15px; }

  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(70px);
    background: var(--text); color: #0a0a11; padding: 9px 16px; border-radius: 10px;
    font: 560 13px var(--font); z-index: 60; opacity: 0;
    transition: transform .2s var(--ease), opacity .2s var(--ease); pointer-events: none;
    max-width: 80vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .toast.on { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* Chat becomes a slide-over on narrower screens; sidebar stays a push panel. */
  @media (max-width: 1200px) {
    .chat {
      position: fixed; top: 52px; right: 0; bottom: 0; z-index: 20;
      box-shadow: -18px 0 50px rgba(0,0,0,.45); background: var(--panel-solid);
    }
    .shell[data-chat="closed"] .chat { transform: translateX(100%); width: var(--chat); opacity: 1; border-left: 1px solid var(--hairline); }
    .shell[data-chat="open"] .chat { transform: translateX(0); }
  }
  @media (max-width: 940px) {
    body { overflow: auto; }
    .top { position: sticky; }
    .shell { position: static; flex-direction: column; }
    .main { flex-direction: column; }
    .editor, .preview, .source { border-right: 0; border-bottom: 1px solid var(--hairline); }
    #ed { min-height: 44vh; }
  }

  /* ---------------------------------------- brand logo + header dropdowns */
  .brand-logo { display: flex; align-items: center; flex-shrink: 0; }
  .brand-logo svg { height: 26px; width: auto; display: block; }
  .hdrop { position: relative; flex-shrink: 0; }
  .hdrop__btn {
    width: 32px; height: 32px; border: 0;
    background: transparent; border-radius: 8px;
    color: var(--text-2); cursor: pointer;
    display: grid; place-items: center;
    transition: background-color .16s var(--ease), color .16s var(--ease);
  }
  .hdrop__btn:hover { background: var(--panel); color: var(--text); }
  .hdrop__btn svg { display: block; }
  .hdrop__menu {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 100;
    min-width: 172px;
    background: var(--panel-solid); border: 1px solid var(--hairline-strong);
    border-radius: var(--r-md); overflow: hidden;
    box-shadow: 0 16px 48px rgba(0,0,0,.55);
    opacity: 0; transform: translateY(-6px) scale(.98);
    pointer-events: none;
    transition: opacity .16s var(--ease), transform .16s var(--ease);
  }
  .hdrop__menu.open { opacity: 1; transform: none; pointer-events: all; }
  .hdrop__item {
    display: flex; align-items: center;
    padding: 10px 14px; color: var(--text-2); font: 400 13.5px var(--font);
    text-decoration: none; white-space: nowrap;
    transition: background-color .12s var(--ease), color .12s var(--ease);
  }
  .hdrop__item:hover { background: var(--panel); color: var(--text); }
  .hdrop__sep { border: 0; border-top: 1px solid var(--hairline); margin: 3px 0; }

  /* ---------------------------------------------------------------- subtop */
  .subtop {
    position: fixed; top: 52px; left: 0; right: 0; height: 48px; z-index: 9;
    display: none; align-items: center; gap: 6px; padding: 0 14px;
    border-bottom: 1px solid var(--hairline);
    background: rgba(10,10,16,.58);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  }
  body.mode-ui.subtop-on .subtop { display: flex; }
  body.mode-ui.subtop-on .shell { inset: 100px 0 0 0; }
  body.mode-ui.subtop-on .side { top: 100px; }
  .subtop .folder__path {
    max-width: 180px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; direction: rtl;
    font: 400 11px var(--mono); color: var(--text-2);
  }
  .subtop-div { width: 1px; height: 18px; background: var(--hairline); flex: none; margin: 0 4px; }
  .subtop .kitsel { padding: 5px 28px 5px 10px; font-size: 12px; }
  @media (max-width: 940px) {
    body.mode-ui.subtop-on .shell { position: static; }
    body.mode-ui.subtop-on .subtop { position: sticky; }
  }
</style>
</head>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  var MODE = { '/text': 'text', '/ui': 'ui', '/figma': 'figma', '/convert': 'convert' }[location.pathname] || 'text';
  document.body.classList.add('mode-' + MODE);

  /* --------------------------------------------------- header dropdown toggle */
  document.querySelectorAll('.hdrop').forEach(function (wrap) {
    var btn = wrap.querySelector('.hdrop__btn');
    var menu = wrap.querySelector('.hdrop__menu');
    if (!btn || !menu) return;
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      var open = menu.classList.contains('open');
      document.querySelectorAll('.hdrop__menu').forEach(function (m) { m.classList.remove('open'); });
      document.querySelectorAll('.hdrop__btn').forEach(function (b) { b.setAttribute('aria-expanded', 'false'); });
      if (!open) { menu.classList.add('open'); btn.setAttribute('aria-expanded', 'true'); }
    });
  });
  document.addEventListener('click', function () {
    document.querySelectorAll('.hdrop__menu').forEach(function (m) { m.classList.remove('open'); });
    document.querySelectorAll('.hdrop__btn').forEach(function (b) { b.setAttribute('aria-expanded', 'false'); });
  });
  var TAGS = { text: 'TEXT → MD', ui: 'UI → MD', figma: 'FIGMA → MD', convert: 'FILE → MD' };

  function docSvg(color, letter, fs) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="1.7" stroke-linejoin="round">' +
      '<path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7z"/><path d="M14 2v5h5"/>' +
      '<text x="12" y="17.5" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="' + (fs || 8) +
      '" font-weight="700" fill="' + color + '" stroke="none">' + letter + '</text></svg>';
  }
  var CONVERT_ACCEPT = {
    pdf: '.pdf', word: '.docx,.doc,.rtf', excel: '.xlsx,.csv,.tsv', ppt: '.pptx',
    file: '.docx,.doc,.rtf,.xlsx,.csv,.tsv,.pptx,.pdf,.html,.htm,.txt,.md',
  };
  var CONVERT_TYPES = {
    pdf: { label: 'PDF', exts: '.pdf', color: '#fb7185', tint: 'rgba(251,113,133,.1)', line: 'rgba(251,113,133,.28)',
      svg: docSvg('#fb7185', 'PDF', 6),
      desc: 'Convert a PDF into clean, editable Markdown - running headers, footers and page numbers stripped, paragraphs stitched back together.' },
    word: { label: 'Word', exts: '.docx · .doc · .rtf', color: '#4f8ff7', tint: 'rgba(79,143,247,.1)', line: 'rgba(79,143,247,.28)',
      svg: docSvg('#4f8ff7', 'W'),
      desc: 'Convert a Word document into clean Markdown - real headings, lists and tables, none of the layout junk.' },
    excel: { label: 'Excel', exts: '.xlsx · .csv · .tsv', color: '#21A366', tint: 'rgba(33,163,102,.1)', line: 'rgba(33,163,102,.28)',
      svg: docSvg('#21A366', 'X'),
      desc: 'Turn a workbook into Markdown tables - one section per sheet, empty rows and styling junk dropped.' },
    ppt: { label: 'PowerPoint', exts: '.pptx', color: '#ed6c47', tint: 'rgba(237,108,71,.1)', line: 'rgba(237,108,71,.28)',
      svg: docSvg('#ed6c47', 'P'),
      desc: 'Turn a slide deck into structured Markdown - one section per slide, speaker notes kept as notes.' },
    file: { label: 'File', exts: 'docx · xlsx · csv · pptx · pdf · html · txt', color: '#8b7cff', tint: 'rgba(139,124,255,.12)', line: 'rgba(139,124,255,.3)',
      svg: docSvg('#8b7cff', '?', 9),
      desc: 'Convert a Word, Excel, PowerPoint, PDF, CSV or HTML file into clean, junk-free Markdown.' },
  };

          : '<p>' + (S.groups ? 'Choose a page, section or component found in this folder.' : 'Pick a design system, then choose a component to document.') + '</p>' +

            (S.kits.length > 1

                S.kits.map(function (k) {

                }).join('') + '</select></div>'

        '<p>This demo documents one pre-configured Figma file — no arbitrary links accepted.</p>' +
        (S.figmaDemo
          ? '<button class="btn btn--primary" id="btn-fig-demo">Generate Documentation</button>'

    if (!S.md && MODE === 'figma' && !S.busy) {

      ? 'Write here, or ask the assistant →'

    ta.value = S.md;
    ta.addEventListener('input', function () {
      S.md = ta.value;
      stash();
      S.dirty = true;
      setStatus('dirty', 'not saved');
      clearTimeout(ta._t);
      ta._t = setTimeout(function () { paintPreview(); validate(); }, 150);
    });
    ta.addEventListener('keydown', function (e) {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
      if (e.key === 'Tab') {
        e.preventDefault();
        ta.setRangeText('  ', ta.selectionStart, ta.selectionEnd, 'end');

  function paintPreview() {
    $('prevbody').innerHTML = S.md
      ? '<div class="md">' + md(S.md) + '</div>'
      : '<div class="placeholder"><div><div class="big">&#10022;</div>Nothing to preview yet.</div></div>';
  }

  function validate() {
    var el = $('valid');
    if (!S.md) { el.innerHTML = ''; return; }
    var fences = (S.md.match(/^\s*```/gm) || []).length;
    var ok = /^#\s+.+/m.test(S.md) && fences % 2 === 0 &&
             !/^(here is|here's|sure|certainly|i cannot|i can't)/i.test(S.md.trim());
    el.innerHTML = ok
      ? '<span class="v-ok">&#10003; Markdown · &#10003; structure validated</span>'
      : '<span class="v-warn">&#9888; Markdown needs review</span>';
  }

  function setStatus(kind, text) { $('status').dataset.s = kind || ''; $('status').textContent = text; }

  // Where the current markdown belongs when the user switches items.
  function stash() {
    if (MODE === 'ui' && S.current) S.uiDocs[S.current] = S.md;
    if (MODE === 'figma' && S.curFrame) S.frameDocs[S.curFrame] = S.md;
  }

  function setDoc(text, name) {
    S.md = text || '';
    stash();
    if (name != null) $('title').value = String(name).replace(/\.md$/i, '');
    paintEditor(); paintPreview(); validate(); paintTop(); paintChat();
  }

    } else if (MODE === 'ui') {
      h = (S.importDir

                : '')
            : '<div class="importbox"><h3>Import UI Components</h3>' +

      h = '<div class="list" id="slist"></div>' +

    el.innerHTML = h;

          '<div class="item__t">' + esc(d.title) + '</div>' +
          '<div class="item__m">' + esc(d.name) + ' · ' + d.words + 'w · ' + ago(d.mtime) + '</div></button>';
      }).join('') : '<p class="empty">' + (S.docs.length ? 'No document matches.' : 'No documents yet. Describe one in the assistant.') + '</p>';
      Array.prototype.forEach.call(list.querySelectorAll('[data-doc]'), function (b) {
        b.onclick = function () { openDoc(b.getAttribute('data-doc')); };
      });
      var qEl = $('q');
      qEl.addEventListener('input', function () { S.filter = qEl.value; paintSidebar(); });
      $('btn-new').onclick = newDoc;
      $('btn-reload').onclick = function () { loadDocs(); toast('Folder re-read'); };
    } else if (MODE === 'ui') {
      function row(id, name, type) {
        var done = !!S.uiDocs[id];
        return '<button class="item" data-comp="' + esc(id) + '" data-name="' + esc(name) + '"' +
          (type ? ' data-type="' + esc(type) + '"' : '') +

          '<div class="item__t" style="padding-right:24px">' + esc(name) + '</div>' +

          '</button>';

      if (!S.importDir) list.innerHTML = '';
      else if (S.groups) {
        // Segregated folder: group headers only when there is more than one group.
        list.innerHTML = S.groups.length
          ? S.groups.map(function (g) {
              return (S.groups.length > 1 ? '<div class="ghead">' + esc(g.label) + ' (' + g.items.length + ')</div>' : '') +
                g.items.map(function (u) { return row(u.uid, u.name, u.type); }).join('');

          : '<p class="empty">Nothing documentable found here - no HTML pages, no component ' +
            'markup or styles, no React components.</p>';

        list.innerHTML = S.kits.length > 1 && S.kit !== 'global'
          ? '<p class="empty">This design system ships no components of its own yet. ' +
            'The shared components live under <b>Global Kit</b>.</p>'
          : '<p class="empty">No HTML or CSS found here. Components can be subfolders ' +
            '(Button/button.html + button.css) or loose files sharing a name.</p>';

        list.innerHTML = S.components.map(function (c) { return row(c.name, c.name, null); }).join('');
      }
      Array.prototype.forEach.call(list.querySelectorAll('[data-comp]'), function (b) {
        b.onclick = function () {
          openComp(b.getAttribute('data-comp'), b.getAttribute('data-name'), b.getAttribute('data-type'));

      });
      var pick = $('btn-pick') || $('btn-repick');

      if (ks) ks.onchange = function () { setKit(ks.value); };
      $('btn-rescan').onclick = function () { loadComponents(); toast('Folder re-read'); };
    } else {
      list.innerHTML = S.frames.length ? S.frames.map(function (f) {
        return '<button class="item" data-frame="' + esc(f.url) + '" aria-current="' + (f.url === S.curFrame) + '">' +
          (S.frameDocs[f.url] ? '<span class="item__dot" title="Documentation generated"></span>' : '') +
          '<div class="item__t">' + esc(f.name) + '</div>' +
          '<div class="item__m">' + esc(f.url.replace(/^https:\/\/(www\.)?figma\.com\//, '')) + '</div></button>';
      }).join('') : '<p class="empty">No frames yet. Paste a Figma frame link in the main panel to get started.</p>';
      Array.prototype.forEach.call(list.querySelectorAll('[data-frame]'), function (b) {
        b.onclick = function () { openFrame(b.getAttribute('data-frame')); };
      });
      $('btn-newframe').onclick = function () {
        stash();
        S.curFrame = null;
        setDoc('', '');
        paintSidebar();
      };
    }

      h += '<span class="subtop-div"></span>' +

    var opts = '';
    if (S.groups) {
      if (!S.groups.length) return '';
      opts = S.groups.map(function (g) {
        return '<optgroup label="' + esc(g.label) + '">' +
          g.items.map(function (u) {
            return '<option value="' + esc(u.uid) + '">' + esc(u.name) + '</option>';
          }).join('') + '</optgroup>';
      }).join('');

      if (!S.components.length) return '';

  /* ================================================================ text */
  async function loadDocs() {
    try {
      var r = await api('/api/docs');
      S.docs = r.docs;
      paintSidebar();
    } catch (e) { notify('error', 'Cannot read the documents folder.', e.message); }
  }
  async function openDoc(name) {
    if (S.dirty && S.md && !window.confirm('Discard unsaved changes?')) return;
    S.q = null; S.qList = null;
    try {
      var r = await api('/api/doc?name=' + encodeURIComponent(name));
      S.docName = r.name; S.mtime = r.mtime; S.dirty = false;
      S.before = null; S.pending = false;
      setDoc(r.markdown, r.name);
      setStatus('', 'saved ' + ago(r.mtime));
      paintSidebar();
    } catch (e) { notify('error', 'Could not open that document.', e.message); }
  }
  function newDoc() {
    if (S.dirty && S.md && !window.confirm('Discard unsaved changes?')) return;
    S.q = null; S.qList = null;
    S.docName = null; S.mtime = 0; S.dirty = false; S.before = null; S.pending = false;
    setDoc('', '');
    setStatus('', 'not saved yet');
    paintSidebar();
    $('prompt').focus();
  }
  function currentName() {
    var raw = $('title').value.trim();
    if (!raw) return null;
    return /\.md$/i.test(raw) ? raw : raw + '.md';
  }

  /* ================================================================== ui */
  async function pickImport() {
    if (S.siteMode === 'public') return pickImportPublic();
    try {
      var r = await post('/api/pick-folder', { for: 'import', prompt: 'Choose the folder that contains your components (HTML and CSS)' });
      if (r.canceled) return;
      S.importDir = r.path;
      await loadKits();
      await loadComponents();
      toast('Imported ' + S.importDir);
    } catch (e) { notify('error', 'Could not open the folder picker.', e.message); }
  }

  // Public mode has no native folder picker (there is no local disk to browse
  // on a public host) - the browser's own folder-upload input replaces it,
  // and the files land in this visitor's confined workspace folder on the
  // server via /api/kit-upload.
  function pickImportPublic() {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.webkitdirectory = true; inp.multiple = true; inp.style.display = 'none';
    inp.addEventListener('change', function () { uploadKitFolder(inp.files); document.body.removeChild(inp); });
    document.body.appendChild(inp);
    inp.click();
  }
  async function uploadKitFolder(fileList) {
    var files = Array.prototype.filter.call(fileList || [], function (f) { return /\.(html?|css)$/i.test(f.name); });
    if (!files.length) { notify('warn', 'No HTML/CSS files found', 'Pick a folder that contains component markup.'); return; }
    var kitName = ((files[0].webkitRelativePath || files[0].name).split('/')[0] || 'kit').slice(0, 60);
    setStatus('busy', 'Uploading 0/' + files.length + '…');
    var dir = null, failed = 0;
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      var rel = (f.webkitRelativePath || f.name).split('/').slice(1).join('/') || f.name;
      try {
        var j = await api('/api/kit-upload?kit=' + encodeURIComponent(kitName) + '&relpath=' + encodeURIComponent(rel),
          { method: 'POST', body: f });
        if (j && j.dir) dir = j.dir;
      } catch (e) { failed++; }
      setStatus('busy', 'Uploading ' + (i + 1) + '/' + files.length + '…');
    }
    setStatus('', '');
    if (!dir) { notify('error', 'Upload failed', 'Could not upload the folder. Try again.'); return; }
    S.importDir = dir;
    try {
      await api('/api/state', { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ importDir: dir }) });
    } catch (e) { /* non-fatal */ }
    await loadKits();
    await loadComponents();
    toast('Imported ' + files.length + ' files' + (failed ? ' (' + failed + ' failed)' : ''));
  }
  async function loadKits() {
    if (!S.importDir) { paintSidebar(); return; }
    try {
      var r = await api('/api/kits?dir=' + encodeURIComponent(S.importDir));
      S.importDir = r.root;
      S.kits = r.kits;
      var valid = S.kits.some(function (k) { return k.id === (r.kit || S.kit); });
      S.kit = valid ? (r.kit || S.kit) : (S.kits[0] && S.kits[0].id);
    } catch (e) { S.kits = []; S.kit = null; }
  }
  function setKit(id) {
    S.kit = id;
    S.q = null; S.qList = null;
    S.current = null;
    S.before = null; S.pending = false;
    setDoc('', '');
    setStatus('', '');
    api('/api/state', { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ kit: id }) }).catch(function () {});
    loadComponents();
  }
  async function loadComponents() {
    if (!S.importDir) { paintSidebar(); return; }
    try {
      var r = await api('/api/components?dir=' + encodeURIComponent(S.importDir) + '&kit=' + encodeURIComponent(S.kit || ''));
      if (r.mode === 'groups') {
        S.groups = r.groups; S.components = [];
        var all = [];
        r.groups.forEach(function (g) { g.items.forEach(function (u) { all.push(u.uid); }); });
        if (S.current && all.indexOf(S.current) === -1) { S.current = null; S.curName = ''; S.curType = null; }
      } else {
        S.groups = null; S.components = r.components;
        if (S.current && !S.components.some(function (c) { return c.name === S.current; })) {
          S.current = null; S.curName = ''; S.curType = null;
        }
      }
      paintSidebar(); paintTop(); paintEditor();
    } catch (e) { notify('error', 'Could not read the component folder.', e.message); }
  }
  function openComp(id, name, type) {
    stash();
    S.q = null; S.qList = null;
    S.current = id;
    S.curName = name || id;
    S.curType = type || null;
    S.before = null; S.pending = false;
    var existing = S.uiDocs[id] || '';
    setDoc(existing, cap(S.curName));
    setStatus('', existing ? 'generated, not saved' : '');
    paintSidebar();
  }
  async function generate() {
    if (S.busy || !S.current) return;
    S.busy = true;
    paintTop(); paintChips(); paintEditor();
    say('u', 'Generate documentation for ' + cap(S.curName));

    var steps = ['Reading HTML', 'Reading CSS', 'Identifying component structure', 'Identifying variants', 'Generating documentation'];
    var stepAt = 0, t0 = Date.now();
    var g0 = $('btn-gen');
    if (g0) g0.disabled = true;
    var tick = setInterval(function () {
      if (stepAt < steps.length - 1 && Date.now() - t0 > (stepAt + 1) * 1200) stepAt++;
      var line = '<span style="color:var(--accent)">&#9679;</span> ' + steps[stepAt] + '… ' + Math.round((Date.now() - t0) / 1000) + 's';
      $('valid').innerHTML = line;
      var live = $('gen-live');
      if (live) live.textContent = steps[stepAt] + '… ' + Math.round((Date.now() - t0) / 1000) + 's';
      var g = $('btn-gen');
      if (g) { g.disabled = true; g.textContent = 'Generating…'; }
    }, 400);

    var prevDoc = S.md;
    try {
      var r = await post('/api/component-doc', S.groups
        ? { dir: S.importDir, uid: S.current }
        : { dir: S.importDir, kit: S.kit, name: S.current }, true);
      clearInterval(tick);
      S.uiDocs[S.current] = r.markdown;
      S.qList = r.questions || [];
      S.view = 'split';
      S.before = prevDoc; S.pending = true; S.last = { gen: true };
      setDoc(r.markdown, cap(S.curName));
      setStatus('dirty', 'generated, not saved');
      say('a', '<b>Generated documentation for ' + esc(cap(S.curName)) + '</b> in ' + Math.round(r.ms / 1000) + 's. Review it, tell me what to change, or press Download.');
      startQuestions(true);
      paintSidebar();
    } catch (e) {
      clearInterval(tick);
      if (isAbort(e)) {
        say('a', 'Stopped generating.');
      } else {
        var p = e.payload || {};
        say('a', '<b>We couldn’t generate your Markdown.</b> ' + esc(p.explain || e.message), true);
      }
      $('valid').innerHTML = '';
    }
    S.busy = false;
    paintTop(); paintEditor(); paintChat(); validate();
  }

  /* =============================================================== figma */
  // Public mode only: no URL, no recents bookkeeping - always the one file
  // the server operator configured.
  async function figGenerateDemo() {
    if (S.busy) return;
    S.busy = true;
    paintTop(); paintChips();
    say('u', 'Generate documentation for the Figma demo');
    var t0 = Date.now();
    var tick = setInterval(function () {
      $('valid').innerHTML = '<span style="color:var(--accent)">&#9679;</span> Retrieving from Figma & writing… ' + Math.round((Date.now() - t0) / 1000) + 's';
    }, 500);
    var prevDoc = S.md;
    try {
      var r = await post('/api/figma-doc', {}, true);
      clearInterval(tick);
      S.qList = r.questions || [];
      S.before = prevDoc; S.pending = true; S.last = { figDemo: true };
      setDoc(r.markdown, (r.suggestedName || 'Figma demo.md'));
      setStatus('dirty', 'generated, not saved');
      say('a', '<b>Generated documentation</b> from the Figma demo in ' + Math.round(r.ms / 1000) + 's. Review it, tell me what to change, or press Download.');
      startQuestions(true);
    } catch (e) {
      clearInterval(tick);
      if (!isAbort(e)) {
        var p = e.payload || {};
        say('a', '<b>We couldn’t generate your Markdown.</b> ' + esc(p.explain || e.message), true);
      }
      $('valid').innerHTML = '';
    }
    S.busy = false;
    paintTop(); paintEditor(); paintChat(); validate();
  }
  async function figGenerate(url) {
    if (S.busy) return;
    if (!/^https:\/\/(www\.)?figma\.com\//.test(url || '')) {
      notify('warn', 'Paste a Figma link first.', 'It should start with https://www.figma.com/');
      return;
    }
    S.busy = true;
    paintTop(); paintChips(); paintEditor();   // swap the form for the spinner
    say('u', 'Generate documentation for ' + url);
    try {
      var fr = await post('/api/frame', { url: url });
      S.frames = fr.frames; S.curFrame = url;
      paintSidebar();
    } catch (e) { /* recents are cosmetic; generation continues */ }

    var t0 = Date.now();
    var tick = setInterval(function () {
      var secs = Math.round((Date.now() - t0) / 1000);
      // #valid sits in the validation bar, which the landing view hides - the
      // spinner's own line is the one the user can actually see.
      var live = $('gen-live');
      if (live) live.textContent = 'Retrieving from Figma & writing… ' + secs + 's';
      $('valid').innerHTML = '<span style="color:var(--accent)">&#9679;</span> Retrieving from Figma & writing… ' + secs + 's';
    }, 500);

    var prevDoc = S.md;
    try {
      var r = await post('/api/figma-doc', { url: url }, true);
      clearInterval(tick);
      S.frameDocs[url] = r.markdown;
      S.qList = r.questions || [];
      S.before = prevDoc; S.pending = true; S.last = { fig: url };
      setDoc(r.markdown, (r.suggestedName || 'Figma component.md'));
      setStatus('dirty', 'generated, not saved');
      say('a', '<b>Generated documentation</b> from the Figma frame in ' + Math.round(r.ms / 1000) + 's. Review it, tell me what to change, or press Download.');
      startQuestions(true);
      try {
        var st = await api('/api/state');
        S.frames = st.frames;
      } catch (e) { /* fine */ }
      paintSidebar();
    } catch (e) {
      clearInterval(tick);
      if (isAbort(e)) {
        say('a', 'Stopped.');
      } else {
        var p = e.payload || {};
        say('a', '<b>' + esc(p.error || "We couldn’t connect to Figma.") + '</b> ' + esc(p.explain || ''), true);
      }
      $('valid').innerHTML = '';
    }
    S.busy = false;
    paintTop(); paintEditor(); paintPreview(); paintChat();
  }
  function openFrame(url) {
    stash();
    S.q = null; S.qList = null;
    S.curFrame = url;
    var f = S.frames.find(function (x) { return x.url === url; });
    var existing = S.frameDocs[url] || '';
    S.before = null; S.pending = false;
    setDoc(existing, f ? f.name : 'Figma component');
    if (!existing) {
      say('a', 'No generated Markdown is kept for <b>' + esc(f ? f.name : url) + '</b> in this session. ' +
        'Ask me to regenerate it, or paste the link again.');
      // Prefill the drop box for one-click regeneration.
      paintEditor();
      var u = $('figurl');
      if (u) u.value = url;
    }
    setStatus('', existing ? 'generated, not saved' : '');
    paintSidebar();
  }

  /* ============================================================= convert */
  function convertFile() {
    if (S.busy) return;
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = CONVERT_ACCEPT[new URLSearchParams(location.search).get('type')] || CONVERT_ACCEPT.file;
    inp.onchange = function () {
      if (inp.files && inp.files[0]) uploadAndConvert(inp.files[0]);
    };
    inp.click();
  }
  async function uploadAndConvert(f) {
    if (S.busy) return;
    S.curName = f.name;
    S.current = 'upload';
    S.busy = true;
    paintTop(); paintEditor();
    var t0 = Date.now();
    var tick = setInterval(function () {
      var live = $('gen-live');
      if (live) live.textContent = 'Converting… ' + Math.round((Date.now() - t0) / 1000) + 's';
    }, 500);

    try {
      var up = await fetch('/api/upload?name=' + encodeURIComponent(f.name), { method: 'POST', body: f });
      var uj = null;
      try { uj = await up.json(); } catch (e2) { /* non-JSON */ }
      if (!up.ok) {
        var ue = new Error((uj && uj.error) || 'upload failed');
        ue.payload = uj || {};
        throw ue;
      }
      var r = await post('/api/convert', { path: uj.path }, true);
      clearInterval(tick);
      S.view = 'split';
      S.before = null; S.pending = false;
      setDoc(r.markdown, (r.suggestedName || S.curName).replace(/\.md$/i, '').replace(/\.[a-z0-9]+$/i, ''));
      setStatus('', 'converted');
      toast('Converted ' + S.curName + ' in ' + Math.round(r.ms / 1000) + 's');
    } catch (e) {
      clearInterval(tick);
      S.current = null; S.curName = '';
      if (isAbort(e)) toast('Conversion stopped');
      else {
        var p = e.payload || {};
        notify('error', 'Could not convert that file.', p.explain || e.message);
      }
    }
    S.busy = false;
    paintTop(); paintEditor(); validate();
  }

  /* ============================================================ chat send */
  async function send(asking) {
    if (S.busy) return;
    var instruction = $('prompt').value.trim();
    if (!instruction) return;
    $('prompt').value = '';
    $('prompt').style.height = 'auto';

    // No document yet: in text mode that means "write one"; elsewhere, point at the entry step.
    if (!S.md && MODE !== 'text') {
      say('u', instruction);
      say('a', MODE === 'ui'
        ? 'Generate documentation first - choose a folder, pick a component, then press <b>Generate Documentation</b>.'
        : 'Paste a Figma frame link in the main panel and press <b>Fetch &amp; Generate</b> first.');
      return;
    }

    S.busy = true; S.last = { instruction: instruction, asking: !!asking };
    say('u', instruction);
    if (!S.pending) S.before = S.md;
    paintTop(); paintChips();

    var t0 = Date.now();
    var tick = setInterval(function () {
      $('valid').innerHTML = '<span style="color:var(--accent)">&#9679;</span> Claude is ' +
        (asking ? 'answering' : 'writing') + '… ' + Math.round((Date.now() - t0) / 1000) + 's';
    }, 500);

    try {
      var body = {
        instruction: instruction,
        mode: asking ? 'ask' : (S.md ? 'edit' : 'new'),
        markdown: S.md,
      };
      var r = await post('/api/ai', body, true);
      clearInterval(tick);

      if (asking) {
        say('a', md(r.answer || '(no answer)'));
      } else if (!r.markdown || !r.markdown.trim()) {
        S.md = S.before || '';
        say('a', 'Claude returned nothing. Your text is unchanged.', true);
      } else {
        var wasNew = body.mode === 'new';
        S.md = r.markdown;
        stash();
        S.pending = true; S.dirty = true;
        if (wasNew && MODE === 'text' && r.suggestedName) {
          S.docName = null; S.mtime = 0;
          $('title').value = r.suggestedName.replace(/\.md$/i, '');
        }
        if (r.questions && r.questions.length) S.qList = r.questions;
        setStatus('dirty', 'not saved');
        paintEditor(); paintPreview();
        say('a', '<b>' + (wasNew ? 'Wrote the document' : 'Updated the document') + '</b> in ' +
          Math.round((Date.now() - t0) / 1000) + 's - review the editor, then <b>Keep</b> or <b>Discard</b>.');
      }
    } catch (e) {
      clearInterval(tick);
      if (S.before != null && !S.pending) { S.md = S.before; paintEditor(); paintPreview(); }
      if (isAbort(e)) {
        say('a', 'Stopped. Your text is unchanged.');
      } else {
        var p = e.payload || {};
        say('a', '<b>Claude could not do that.</b> ' + esc(p.explain || e.message), true);
      }
      S.pending = false;
    }
    S.busy = false;
    validate(); paintTop(); paintChat();
  }

  function keep() {
    S.pending = false; S.before = null;
    paintChat(); paintTop();
    save();
  }
  function discard() {
    if (S.before == null) return;
    S.md = S.before;
    stash();
    S.before = null; S.pending = false; S.dirty = true; S.q = null; S.qList = null;
    setStatus('dirty', 'not saved');
    paintEditor(); paintPreview(); validate(); paintChat(); paintTop();
    say('a', 'Discarded. Your previous text is back.');
  }
  function regen() {
    if (!S.last) return;
    if (S.last.gen) return generate();
    if (S.last.figDemo) return figGenerateDemo();
    if (S.last.fig) return figGenerate(S.last.fig);
    $('prompt').value = S.last.instruction;
    send(S.last.asking);
  }

  /* ================================================================ save */
  function downloadMd() {
    if (!S.md) return;
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([S.md], { type: 'text/markdown' }));
    a.download = currentName() || 'document.md';
    a.click();
    URL.revokeObjectURL(a.href);
    S.dirty = false;
    setStatus('', 'downloaded');
    toast('Downloaded ' + (currentName() || 'document.md'));
  }
  function save() {
    downloadMd();
  }

  /* ============================================================== events */
  $('btn-side').onclick = function () { S.side = !S.side; paintTop(); };
  $('btn-chat').onclick = function () { S.chat = !S.chat; paintTop(); };
  $('viewmode').addEventListener('click', function (e) {
    var b = e.target.closest('[data-v]');
    if (!b || b.hidden) return;
    S.view = b.getAttribute('data-v');
    paintTop();
  });
  $('btn-save').onclick = save;
  $('btn-copy').onclick = function () {
    navigator.clipboard.writeText(S.md).then(
      function () { toast('Markdown copied'); },
      function () { toast('Copy failed - copy from the editor'); }
    );
  };
  $('btn-send').onclick = function () {
    if (S.busy) { if (S.ctrl) S.ctrl.abort(); return; }
    send(false);
  };
  $('prompt').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(false); }
  });
  $('prompt').addEventListener('input', function () {
    var p = $('prompt');
    p.style.height = 'auto';
    var h = Math.max(21, Math.min(180, p.scrollHeight));
    p.style.height = h + 'px';
    p.dataset.tall = h > 34 ? '1' : '';
  });
  $('title').addEventListener('input', function () {
    S.dirty = true;
    setStatus('dirty', 'not saved');
    var t = $('title');
    t.style.width = Math.min(30, Math.max(4, (t.value || '').length + 1)) + 'ch';
  });
  document.addEventListener('keydown', function (e) {
    var mod = e.metaKey || e.ctrlKey;
    if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
    if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); S.chat = true; paintTop(); $('prompt').focus(); }
    if (e.key === 'Escape' && S.qBig) { S.qBig = false; paintChat(); return; }
    if (e.key === 'Escape' && S.side) { S.side = false; paintTop(); }
  });
  // The sidebar is transient: any click outside it (or its hamburger) closes it.
  document.addEventListener('pointerdown', function (e) {
    if (!S.side) return;
    if (e.target.closest('.side') || e.target.closest('#btn-side')) return;
    S.side = false;
    paintTop();
  });
  window.addEventListener('beforeunload', function (e) {
    if (S.dirty && S.md) { e.preventDefault(); e.returnValue = ''; }
  });

  /* ================================================================ boot */
  (async function () {
    document.title = 'ilovemd · ' + TAGS[MODE].replace(' → ', ' → ');
    paintTop(); paintSidebar(); paintEditor(); paintPreview(); paintChat();

    try {
      var setup = await api('/api/setup');
      S.siteMode = setup.mode;
      S.figmaDemo = setup.figmaDemo;
    } catch (e) { S.siteMode = 'local'; }
    if (S.siteMode === 'public') {
      var lo = $('menu-logout');
      if (lo) lo.addEventListener('click', function (e) {
        e.preventDefault();
        api('/api/logout', { method: 'POST' }).catch(function () {}).then(function () { location.href = '/login'; });
      });
    }

    try {
      var st = await api('/api/state');
      S.importDir = st.importDir;
      S.frames = st.frames || [];
    } catch (e) { /* fine */ }

    if (MODE === 'text') {
      // Start blank: recent documents live in the sidebar, not in the editor.
      await loadDocs();
      setStatus('', 'not saved yet');
    } else if (MODE === 'ui') {
      await loadKits();
      await loadComponents();
    } else {
      paintSidebar();
      paintEditor(); // siteMode just resolved - repaints the figma tab correctly
    }
    paintTop();
  })();
})();
</script>
</body>
</html>
