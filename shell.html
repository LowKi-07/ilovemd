<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>ilovemd</title>
<link rel="stylesheet" href="/nav.css">
<style>
  /* ------------------------------------------------------------ tokens
     Identical across every ilovemd page. */
  :root {
    --canvas: #08080c;
    --panel: rgba(255,255,255,.038);
    --panel-raised: rgba(255,255,255,.062);
    --panel-solid: #12121a;
    --hairline: rgba(255,255,255,.085);
    --hairline-strong: rgba(255,255,255,.16);
    --text: #f5f5fa;
    --text-2: #a3a3b4;
    --text-3: #6d6d7e;
    --accent: #8b7cff;
    --accent-soft: rgba(139,124,255,.16);
    --accent-2: #3fd0e0;
    --primary: #4f46e5;
    --primary-hov: #4338ca;
    --gradient: linear-gradient(135deg,#8b7cff 0%,#6f8bff 45%,#3fd0e0 100%);
    --ok: #34d399;
    --warn: #fbbf24;
    --danger: #fb7185;
    --r-sm: 8px; --r-md: 12px; --r-lg: 18px; --r-pill: 999px;
    --blur: saturate(180%) blur(16px);
    --ease: cubic-bezier(.2,.8,.3,1);
    --font: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
    --side: 244px;
    --chat: 320px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--canvas); color: var(--text);
    font: 400 15px/1.6 var(--font);
    overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    /* Both glows sit well clear of the top: anchored up there, the purple one
       put a lighter wash directly behind the site bar and the band where it
       stopped read as a seam across the page. */
    background:
      radial-gradient(46em 30em at -8% 112%, rgba(139,124,255,.13), transparent 60%),
      radial-gradient(42em 28em at 106% 96%, rgba(63,208,224,.09), transparent 58%);
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,.11); border-radius: var(--r-pill);
    border: 2px solid transparent; background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.2); background-clip: padding-box; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ------------------------------------------------------------ buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 999px;   /* every CTA is a pill, like the homepage's */
    border: 1px solid transparent; background: transparent;
    color: var(--text); font: 560 13px var(--font);
    cursor: pointer; white-space: nowrap; text-decoration: none;
    transition: transform .16s var(--ease), background-color .16s var(--ease);
  }
  .btn:hover:not(:disabled) { transform: translateY(-1px); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn--stroke { border-color: var(--hairline-strong); background: var(--panel); }
  .btn--stroke:hover:not(:disabled) { background: var(--panel-raised); }
  .btn--ghost { color: var(--text-2); }
  .btn--ghost:hover:not(:disabled) { background: var(--panel); color: var(--text); }
  /* Secondary CTA: an outline beside or under a primary, same size. */
  .btn--outline { border-color: rgba(139,124,255,.55); color: var(--text); font-weight: 600; }
  .btn--outline:hover:not(:disabled) { background: rgba(139,124,255,.12); border-color: rgba(139,124,255,.8); }
  /* A primary with its secondary stacked under it: both as wide as the wider one. */
  .ctastack { display: inline-grid; gap: 10px; }
  .ctastack .btn { justify-content: center; }
  .btn--primary { background: var(--primary); color: #fff; font-weight: 620; }
  .btn--primary:hover:not(:disabled) { background: var(--primary-hov); }
  .btn--sm { padding: 5px 10px; font-size: 12.5px; }
  .btn svg { width: 14px; height: 14px; flex: none; }

  .mode {
    display: inline-flex; border: 1px solid var(--hairline);
    border-radius: var(--r-pill); overflow: hidden; flex: none;
  }
  .mode button {
    border: 0; background: transparent; color: var(--text-3);
    font: 500 11px var(--font); padding: 4px 11px; cursor: pointer;
  }
  .mode button[aria-pressed="true"] { background: var(--accent-soft); color: var(--text); }

  /* -------------------------------------------------------------- topbar */
  /* No fill of its own: the panels start below it, so nothing ever passes
     underneath, and a tinted bar here only made a band behind the site bar. */
  .top {
    position: fixed; top: var(--navh); left: 0; right: 0; height: 52px; z-index: 10;
    display: flex; align-items: center; gap: 10px; padding: 0 12px;
    background: transparent;
  }
  .burger {
    width: 32px; height: 32px; border: 0; background: none; color: var(--text-2);
    border-radius: 50%; cursor: pointer; font-size: 15px; display: grid; place-items: center;
  }
  .burger:hover { background: var(--panel); color: var(--text); }
  .burger[aria-pressed="true"] { background: var(--accent-soft); color: var(--text); }
  .brandname { font-size: 15px; font-weight: 660; letter-spacing: -.015em; color: var(--text); text-decoration: none; }
  .modetag {
    font: 600 10px var(--mono); letter-spacing: .06em; color: var(--accent-2);
    border: 1px solid rgba(63,208,224,.3); background: rgba(63,208,224,.1);
    border-radius: var(--r-sm); padding: 2px 7px; white-space: nowrap;
  }
  #title {
    font: 620 14px var(--font); letter-spacing: -.01em;
    background: transparent; border: 1px solid transparent; border-radius: 8px;
    color: var(--text); padding: 4px 8px; min-width: 8ch; max-width: 30ch;
  }
  #title:hover { border-color: var(--hairline); }
  #title:focus { border-color: rgba(139,124,255,.6); outline: none; background: var(--panel); }
  #title[readonly] { border-color: transparent; background: transparent; cursor: default; }
  #title[readonly]:hover { border-color: transparent; }
  .status { font: 400 11px var(--mono); color: var(--text-3); white-space: nowrap; }
  .sp { flex: 1 1 auto; min-width: 0; }

  /* --------------------------------------------------------------- shell */
  .shell {
    position: fixed; inset: calc(var(--navh) + 52px) 0 0 0; z-index: 1; display: flex;
  }
  /* The homepage hero's dot pattern, fainter: behind every card in the
     workspace (z-index -1 inside .shell's stacking context), fading out
     toward the edges so it reads as texture, not a grid. */
  .shell::before {
    content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background-image: radial-gradient(circle at 1px 1px, rgba(163,163,180,.24) 1px, transparent 1.25px);
    background-size: 16px 16px;
    -webkit-mask-image: radial-gradient(ellipse 70% 75% at 50% 40%, #000 25%, transparent 85%);
            mask-image: radial-gradient(ellipse 70% 75% at 50% 40%, #000 25%, transparent 85%);
  }
  /* Text mode is panels edge to edge - no dots behind them there. */
  body.mode-text .shell::before { display: none; }
  .panel { min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  /* No rule or tint under the label: inside a card it read as a seam across
     the top of every panel. The label sits straight on the card now. */
  .phead {
    flex: none; display: flex; align-items: center; gap: 8px;
    height: 36px; padding: 0 14px;
    background: transparent;
  }
  .phead .lbl {
    font: 600 10.5px var(--font); letter-spacing: .09em;
    text-transform: uppercase; color: var(--text-3); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .pbody { flex: 1; min-height: 0; overflow: auto; }

  /* -------------------------------------------------------------- sidebar
     A transient overlay: closed by default, opened by the hamburger, closed
     again by any click outside it. It floats over the panels rather than
     pushing them around. */
  .side {
    position: fixed; top: calc(var(--navh) + 52px); left: 0; bottom: 0; z-index: 25;
    width: var(--side); max-width: 86vw;
    border-right: 1px solid var(--hairline); background: var(--panel-solid);
    box-shadow: 18px 0 50px rgba(0,0,0,.45);
    display: flex; flex-direction: column; overflow: hidden;
    transform: translateX(-100%);
    transition: transform .18s var(--ease);
  }
  .shell[data-side="open"] .side { transform: translateX(0); }
  .side .inner { width: var(--side); max-width: 86vw; display: flex; flex-direction: column; height: 100%; }
  .searchwrap { flex: none; padding: 10px 10px 6px; }
  input[type=search], .side input[type=text] {
    width: 100%; font: 400 13px var(--font); color: var(--text);
    background: var(--panel); border: 1px solid var(--hairline);
    border-radius: 10px; padding: 7px 10px; appearance: none;
  }
  input:focus { border-color: rgba(139,124,255,.6); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
  .list { flex: 1; min-height: 0; overflow: auto; padding: 4px 8px 20px; }
  .item {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: none; border: 0; color: var(--text);
    padding: 8px 10px; border-radius: 10px; margin-bottom: 2px; position: relative;
  }
  .item:hover { background: var(--panel); }
  .item[aria-current="true"] { background: var(--accent-soft); }
  .item[aria-current="true"]::before {
    content: ''; position: absolute; left: 2px; top: 9px; bottom: 9px;
    width: 2px; border-radius: 2px; background: var(--accent);
  }
  .item__t {
    font-size: 13.5px; font-weight: 540; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .item__m { font: 400 11px var(--mono); color: var(--text-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item__dot { position: absolute; right: 10px; top: 12px; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
  .item__st {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    width: 15px; height: 15px; border-radius: 50%; flex: none;
    display: grid; place-items: center; font: 700 9px var(--font);
  }
  .item__st--ok { background: rgba(52,211,153,.15); color: var(--ok); border: 1px solid rgba(52,211,153,.4); }
  .item__st--todo { border: 1.5px solid var(--hairline-strong); }
  .kitwrap { padding: 10px 10px 2px; position: relative; }
  .kitsel {
    width: 100%; font: 560 13px var(--font); color: var(--text);
    background-color: var(--panel);
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%23a3a3b4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>');
    background-repeat: no-repeat; background-position: right 12px center; background-size: 16px 16px;
    border: 1px solid var(--hairline);
    border-radius: 10px; padding: 9px 36px 9px 12px;
    appearance: none; -webkit-appearance: none; cursor: pointer;
  }
  .kitsel:hover { border-color: var(--hairline-strong); }
  .kitsel:focus { border-color: rgba(139,124,255,.6); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
  .kitsel option { background: var(--panel-solid); color: var(--text); }
  .empty { color: var(--text-3); font-size: 12.5px; padding: 12px 14px; line-height: 1.55; }
  .ghead {
    font: 600 10px var(--font); letter-spacing: .1em; text-transform: uppercase;
    color: var(--text-3); padding: 12px 10px 4px;
  }
  .sidefoot { flex: none; border-top: 1px solid var(--hairline); padding: 9px 10px; display: flex; gap: 6px; align-items: center; }
  .importbox {
    margin: 12px 10px; padding: 22px 14px; text-align: center;
    border: 1px dashed var(--hairline-strong); border-radius: var(--r-md);
    background: var(--panel);
  }
  .importbox h3 { margin: 0 0 6px; font-size: 13.5px; font-weight: 620; }
  .importbox p { margin: 0 0 14px; font-size: 12px; color: var(--text-2); line-height: 1.5; }
  .importbox .hint { margin: 10px 0 0; font: 400 10px var(--mono); color: var(--text-3); }
  .folder {
    margin: 10px 10px 2px; padding: 7px 9px;
    border: 1px solid var(--hairline); border-radius: 10px; background: var(--panel);
    display: flex; align-items: center; gap: 7px;
  }
  .folder__path {
    flex: 1; min-width: 0; font: 400 10.5px var(--mono); color: var(--text-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left;
  }

  /* ----------------------------------------------------------------- main */
  .main { flex: 1; min-width: 0; display: flex; }
  .editor, .preview { flex: 1; border-right: 1px solid var(--hairline); }
  .preview { background: rgba(255,255,255,.012); }
  .shell[data-view="edit"] .preview { display: none; }
  .shell[data-view="preview"] .editor { display: none; }
  /* Before anything is generated there is nothing to preview and nothing to
     discuss - the markdown panel is the whole stage. */
  .shell[data-noprev="1"] .preview { display: none; }
  .shell[data-noprev="1"] .editor .phead { display: none; }
  .shell[data-nochat="1"] .chat { display: none !important; }

  /* Islands: once a document exists the panes read as separate cards inset
     from the page, rather than full-bleed regions split by hairlines. Only
     then - on a landing page the single pane already holds a card, and
     wrapping that in another card just doubles the framing. */
  .shell[data-islands="1"] { gap: 12px; padding: 0 14px 14px; }
  .shell[data-islands="1"] .main { gap: 12px; }
  .shell[data-islands="1"] .editor,
  .shell[data-islands="1"] .preview,
  .shell[data-islands="1"] .chat {
    border: 1px solid var(--hairline);
    /* All three tops align, so with only a 12px gap between them their top
       borders read as one rule drawn across the whole width. Transparent
       rather than removed, to keep the box model and avoid a 1px shift. */
    border-top-color: transparent;
    border-radius: var(--r-lg);
    background: var(--panel);
    /* The panels are translucent: blur what is behind them so the workspace
       dot pattern frames the cards without dotting the writing area. */
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    overflow: hidden;
  }
  /* A zero-width chat still leaves the row's gap behind it, and its border
     would show as a sliver. */
  .shell[data-islands="1"][data-chat="closed"] { gap: 0; }
  .shell[data-chat="closed"] .chat { border: 0; }

  #ed {
    flex: 1; width: 100%; min-height: 0; resize: none; display: block;
    font: 400 13px/1.75 var(--mono); color: #dcdce6;
    background: transparent; border: 0; padding: 18px 20px 40px;
    tab-size: 2; caret-color: var(--accent-2);
  }
  #ed:focus { outline: none; }

  /* Editor with a line-number gutter and CommonMark markers. A textarea
     cannot number its own lines, so a backdrop behind it holds the same
     text, one block per line, laid out identically but invisible: each
     line's number and marker sit in the gutter beside its first visual row,
     even when it wraps. The textarea starts after the gutter, so markers
     there stay hoverable. */
  .edbox { --gut: 50px; position: relative; flex: 1; min-height: 0; }
  .edbox #ed {
    position: absolute; top: 0; bottom: 0; right: 0; left: var(--gut);
    width: auto; height: 100%; padding-left: 14px;
    white-space: pre-wrap; overflow-wrap: break-word;
  }
  .edbk {
    position: absolute; inset: 0; overflow: hidden; pointer-events: none;
    font: 400 13px/1.75 var(--mono); color: transparent; tab-size: 2;
    white-space: pre-wrap; overflow-wrap: break-word;
    padding: 18px calc(20px + var(--sbw, 0px)) 40px calc(var(--gut) + 14px);
  }
  .ln { position: relative; border-radius: 3px; }
  .ln::before {
    content: attr(data-n); position: absolute; right: calc(100% + 22px);
    font: 400 11px/inherit var(--mono); line-height: inherit; color: #555566; text-align: right;
  }
  .ln--warn { background: rgba(251,191,36,.07); }
  .ln--err { background: rgba(251,113,133,.09); }
  .ln--warn::before { color: var(--warn); }
  .ln--err::before { color: var(--danger, #fb7185); }
  .ln__mk {
    position: absolute; left: calc(-1 * (var(--gut) + 14px) + 6px); top: 0;
    font: 700 11px/inherit var(--font); line-height: inherit; pointer-events: auto; cursor: help;
  }
  .ln__mk--warn { color: var(--warn); }
  .ln__mk--err { color: var(--danger, #fb7185); }

  /* CommonMark result in the editor header: hover lists it, click jumps. */
  .chk {
    margin-left: auto; border: 1px solid var(--hairline); border-radius: 999px; background: var(--panel);
    font: 500 10.5px var(--mono); padding: 2px 9px; cursor: pointer; color: var(--text-3);
    white-space: nowrap; transition: border-color .15s var(--ease), background-color .15s var(--ease);
  }
  .chk:hover { background: var(--panel-raised); }
  .chk--ok { color: var(--ok); border-color: rgba(52,211,153,.3); cursor: help; }
  .chk--warn { color: var(--warn); border-color: rgba(251,191,36,.35); }
  .chk--err { color: var(--danger, #fb7185); border-color: rgba(251,113,133,.4); }
  /* ▲ ▼ beside the badge, like a find bar */
  .chknav { display: inline-flex; gap: 2px; margin-left: 4px; }
  .chknav[hidden] { display: none; }
  .chknav__b {
    display: grid; place-items: center; width: 22px; height: 22px; padding: 0;
    border: 1px solid var(--hairline); border-radius: 50%; background: var(--panel);
    color: var(--text-2); cursor: pointer;
  }
  .chknav__b:hover { color: var(--text); background: var(--panel-raised); }
  .chknav__b svg { width: 13px; height: 13px; }
  /* "Fix it" at the right end of a flagged line, on hover */
  .fixit {
    position: absolute; z-index: 3; right: calc(14px + var(--sbw, 0px));
    display: none; align-items: center; gap: 5px;
    border: 1px solid rgba(139,124,255,.5); border-radius: 999px; background: #1b1830;
    color: #d9d4ff; font: 600 11px var(--font); padding: 3px 10px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
  }
  .fixit.on { display: inline-flex; }
  .fixit:hover { background: #262143; color: #fff; }
  #ed::placeholder { color: var(--text-3); }
  #ed::selection { background: rgba(139,124,255,.32); }

  .placeholder {
    height: 100%; flex: 1; display: grid; place-items: center; text-align: center;
    color: var(--text-3); font-size: 13px; padding: 30px;
  }
  .placeholder .big { font-size: 26px; margin-bottom: 10px; opacity: .6; }

  /* Figma → MD demo: a FigJam-style board - white, light grey dot grid, no
     tool chrome - holding the one sample frame. */
  .figdemo { width: min(980px, 100%); display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .figboard {
    width: 100%; height: min(62vh, 600px); min-height: 360px;
    border-radius: 18px; overflow: auto;
    background: #fff radial-gradient(circle, #cfd2d8 1.15px, transparent 1.45px) 0 0 / 22px 22px;
    box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 24px 60px -24px rgba(0,0,0,.7);
    display: grid; place-items: center; padding: 28px; position: relative;
  }
  /* the card at 80% of its 305 x 404 frame */
  .figboard img {
    width: 244px; max-width: 100%; height: auto; display: block;
    box-shadow: 0 1px 2px rgba(16,24,40,.06), 0 12px 32px -12px rgba(16,24,40,.22);
  }
  .figboard__tag {
    position: absolute; top: 16px; right: 16px;
    padding: 5px 11px; border-radius: 999px;
    background: #efedff; border: 1px solid #d9d4ff; color: #4f46e5;
    font: 600 11px/1 var(--font); letter-spacing: .06em; text-transform: uppercase;
  }
  .figdemo__cap { font: 400 12px var(--font); color: var(--text-3); margin: -6px 0 0; }
  .figdemo__actions { display: flex; gap: 10px; align-items: center; }
  /* Glassmorphic, matching the tool cards on the homepage: diagonal purple
     lighting from the top-left falling away to near-black. */
  .dropbox {
    position: relative; overflow: hidden;
    border: 1px solid rgba(139,124,255,.09);
    background:
      linear-gradient(135deg,
        rgba(139,124,255,.065) 0%,
        rgba(111,139,255,.025) 40%,
        rgba(8,8,16,.55) 100%);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border-radius: var(--r-lg); padding: 34px 30px; max-width: 420px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.05),
      inset 1px 0 0 rgba(255,255,255,.025),
      0 4px 24px rgba(0,0,0,.28);
  }
  .dropbox::before {
    content: ''; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background: linear-gradient(135deg,
      rgba(255,255,255,.04) 0%,
      rgba(139,124,255,.02) 30%,
      transparent 55%);
  }
  /* Children sit above the lighting overlay. */
  .dropbox > * { position: relative; z-index: 1; }
  /* Border beam, after Magic UI's: a short gradient travels the card's edge.
     .beam is a ring the width of the border (padding + an XOR mask leaves
     only the padding visible); its ::after is the light, moved along the
     card's rounded outline by offset-path at a constant speed. */
  .dropbox--beam { --beam-size: 50px; --beam-dur: 6s; --beam-w: 1px; --beam-from: #8b7cff; --beam-to: #3fd0e0; }
  .dropbox > .beam {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    border-radius: inherit; padding: var(--beam-w);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  }
  .beam::after {
    content: ''; position: absolute; width: var(--beam-size); aspect-ratio: 1;
    background: linear-gradient(to left, var(--beam-from), var(--beam-to), transparent);
    offset-path: rect(0 auto auto 0 round var(--beam-size));
    animation: beam var(--beam-dur) linear infinite;
  }
  @keyframes beam { from { offset-distance: 0%; } to { offset-distance: 100%; } }
  @supports not (offset-path: rect(0 auto auto 0)) { .beam { display: none; } }
  @media (prefers-reduced-motion: reduce) { .beam { display: none; } }
  .dropbox--bare {
    border-color: transparent; background: transparent;
    backdrop-filter: none; -webkit-backdrop-filter: none; box-shadow: none;
  }
  .dropbox--bare::before { display: none; }
  /* The primary action sits right; back is centred in whatever room is left,
     so the gap either side of it matches. The preceding <p> already carries a
     16px bottom margin, so only a little is needed here. */
  .dropbox__actions {
    display: flex; align-items: center; margin-top: 2px;
  }
  /* No gap on the row: the cell has to reach the primary button for centring
     inside it to leave matching space on both sides of back. */
  .dropbox__back { flex: 1 1 auto; display: flex; justify-content: center; }
  .ftile {
    width: 58px; height: 58px; border-radius: 15px;
    display: grid; place-items: center;
    background: var(--tb, rgba(255,255,255,.05));
    border: 1px solid var(--tl, var(--hairline));
  }
  .ftile svg { width: 30px; height: 30px; display: block; }
  .fpair { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 18px; }
  .fpair .arr { color: var(--text-3); font-size: 18px; }
  .loader {
    width: 34px; height: 34px; margin: 0 auto 18px; border-radius: 50%;
    border: 3px solid var(--hairline-strong); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Folder upload progress, shown inside the landing card above its actions. */
  .upl { margin: 0 0 16px; text-align: left; }
  .upl__row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; font-size: 12px; color: var(--text-2); }
  .upl__name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .upl__count { flex: none; font: 400 11px var(--mono); color: var(--text-3); }
  .upl__bar { height: 4px; border-radius: var(--r-pill); background: var(--hairline-strong); overflow: hidden; }
  .upl__bar > span { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .2s ease; }
  .upl__foot { display: flex; justify-content: center; margin-top: 18px; }
  /* While a folder uploads, nothing else may start another one. */
  body.is-uploading #btn-pick, body.is-uploading #btn-repick,
  body.is-uploading #sub-pick, body.is-uploading #sub-repick,
  body.is-uploading #kitsel, body.is-uploading #sub-kitsel, body.is-uploading #btn-rescan {
    opacity: .4; pointer-events: none;
  }
  .dropbox h3 { margin: 0 0 6px; font-size: 15px; font-weight: 620; color: var(--text); }
  .dropbox p { margin: 0 0 16px; font-size: 12.5px; color: var(--text-2); line-height: 1.55; }
  /* A failure shown on the landing card itself (the chat is hidden there). */
  .carderr {
    margin: 0 0 14px; padding: 10px 12px; text-align: left;
    border: 1px solid rgba(251,113,133,.4); border-radius: var(--r-md);
    background: rgba(251,113,133,.08); font-size: 12px; line-height: 1.5; color: var(--text-2);
  }
  .carderr b { display: block; color: var(--text); font-weight: 600; margin-bottom: 2px; }
  .figtok-help { margin: -4px 0 14px; text-align: left; font-size: 11.5px; color: var(--text-3); }
  .figtok-help summary {
    cursor: pointer; width: max-content; list-style: none;
    display: inline-flex; align-items: center; gap: 5px; border-radius: 6px;
  }
  .figtok-help summary::-webkit-details-marker { display: none; }
  .figtok-help summary::marker { content: ''; }
  /* chevron: right when closed, down when open */
  .figtok-help summary::before {
    content: ''; width: 6px; height: 6px; flex: none; margin: 0 2px 0 1px;
    border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
    transform: rotate(-45deg); transition: transform .18s var(--ease);
  }
  .figtok-help[open] summary::before { transform: translateY(-2px) rotate(45deg); }
  .figtok-help summary:hover { color: var(--text-2); }
  @media (prefers-reduced-motion: reduce) { .figtok-help summary::before { transition: none; } }
  .figtok-help ol { margin: 8px 0 6px; padding-left: 18px; line-height: 1.6; color: var(--text-2); }
  .figtok-help p { margin: 0; font-size: 11.5px; color: var(--text-3); }
  .dropbox input {
    width: 100%; font: 400 12px var(--mono); color: var(--text);
    background: rgba(0,0,0,.3); border: 1px solid var(--hairline);
    border-radius: 10px; padding: 9px 11px; margin-bottom: 12px;
  }

  .code {
    margin: 0; padding: 18px 20px 40px;
    font: 400 12.5px/1.7 var(--mono); color: #dcdce6;
    white-space: pre; overflow: auto; min-height: 100%;
  }
  .tabs { display: flex; gap: 4px; min-width: 0; overflow-x: auto; }
  .tab {
    border: 1px solid var(--hairline); background: var(--panel);
    color: var(--text-2); border-radius: var(--r-pill);
    padding: 2px 10px; font: 500 10.5px var(--mono); cursor: pointer; white-space: nowrap;
  }
  .tab[aria-pressed="true"] { background: var(--accent-soft); color: var(--text); border-color: rgba(139,124,255,.55); }
  .genbar {
    flex: none; border-top: 1px solid var(--hairline);
    background: rgba(10,10,16,.66);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    padding: 9px 14px; display: flex; align-items: center; gap: 10px;
  }
  .genstatus { flex: 1; min-width: 0; font: 400 11.5px var(--mono); color: var(--text-2); }
  .genstatus .tick { color: var(--ok); }
  .genstatus .doing { color: var(--accent); }

  /* markdown preview */
  .md { padding: 22px 26px 60px; max-width: 78ch; }
  .md > :first-child { margin-top: 0; }
  .md h1 { font-size: 24px; margin: 0 0 10px; letter-spacing: -.02em; }
  .md h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--text-3); margin: 28px 0 10px; padding-bottom: 6px;
    border-bottom: 1px solid var(--hairline); font-weight: 650;
  }
  .md h3 { font-size: 15px; margin: 20px 0 6px; }
  .md p { margin: 0 0 11px; }
  .md ul, .md ol { margin: 0 0 12px; padding-left: 22px; }
  .md li { margin: 3px 0; }
  .md hr { border: 0; border-top: 1px solid var(--hairline); margin: 24px 0; }
  .md blockquote {
    margin: 0 0 12px; padding: 9px 13px; border-left: 3px solid var(--hairline-strong);
    background: var(--panel); border-radius: 0 8px 8px 0; color: var(--text-2);
  }
  .md blockquote p:last-child { margin: 0; }
  .md code {
    font: 400 12.5px var(--mono); background: rgba(255,255,255,.06);
    padding: 2px 5px; border-radius: 5px; word-break: break-word;
  }
  .md pre {
    background: rgba(0,0,0,.35); border: 1px solid var(--hairline);
    border-radius: 10px; padding: 13px 15px; overflow-x: auto; margin: 0 0 13px;
  }
  .md pre code { background: none; padding: 0; font-size: 12px; white-space: pre; }
  .tablewrap { overflow-x: auto; margin: 0 0 14px; border: 1px solid var(--hairline); border-radius: 10px; }
  .md table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .md th, .md td { text-align: left; padding: 7px 11px; border-bottom: 1px solid var(--hairline); vertical-align: top; }
  .md th {
    background: var(--panel); font: 600 10.5px var(--font);
    text-transform: uppercase; letter-spacing: .05em; color: var(--text-2); white-space: nowrap;
  }
  .md tbody tr:last-child td { border-bottom: 0; }
  .md img { max-width: 100%; }

  /* ----------------------------------------------------------------- chat */
  .chat {
    flex: none; width: var(--chat);
    border-left: 1px solid var(--hairline); background: rgba(255,255,255,.012);
    display: flex; flex-direction: column; overflow: hidden;
    transition: width .18s var(--ease), opacity .18s var(--ease);
  }
  .shell[data-chat="closed"] .chat { width: 0; opacity: 0; pointer-events: none; border-left: 0; }
  .chat .inner { width: var(--chat); display: flex; flex-direction: column; height: 100%; }
  .msgs { flex: 1; min-height: 0; overflow: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 92%; border-radius: 12px; padding: 8px 12px; font-size: 13px; line-height: 1.55; }
  .msg--u { align-self: flex-end; background: var(--accent-soft); border: 1px solid rgba(139,124,255,.3); }
  .msg--u { white-space: pre-wrap; }   /* keeps a typed line break and the attachment line */
  .msg--a { align-self: flex-start; background: var(--panel); border: 1px solid var(--hairline); color: var(--text-2); }
  .msg--a b { color: var(--text); font-weight: 620; }
  .msg--err { border-color: rgba(251,113,133,.4); background: rgba(251,113,133,.08); }
  .msg .when { display: block; font: 400 10px var(--mono); color: var(--text-3); margin-top: 4px; }
  .chatempty { color: var(--text-3); font-size: 12.5px; text-align: center; margin: auto 10px; line-height: 1.6; }
  .pacts { display: flex; gap: 2px; align-self: flex-start; margin: -4px 0 0 2px; }
  .ibtn {
    width: 30px; height: 30px; border: 0; background: none; border-radius: 8px;
    color: var(--text-3); cursor: pointer; display: grid; place-items: center;
    transition: background-color .16s var(--ease), color .16s var(--ease);
  }
  .ibtn:hover { background: var(--panel-raised); color: var(--text); }
  .ibtn svg { width: 16px; height: 16px; display: block; }

  /* clarifications card, styled after Claude's own question panel */
  .qcard__bar { display: flex; align-items: center; gap: 4px; }
  .qcard__title {
    font: 600 10.5px var(--font); letter-spacing: .1em; text-transform: uppercase;
    color: var(--text-3);
  }
  .qcard__bar .ibtn { width: 24px; height: 24px; }
  .qcard__bar .ibtn svg { width: 13px; height: 13px; }
  .qoverlay {
    position: fixed; inset: 0; z-index: 80; padding: 24px;
    background: rgba(5,5,10,.62);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    display: grid; place-items: center;
  }
  .qoverlay .qcard { align-self: center; justify-self: center; }
  .qcard--big {
    width: min(680px, 94vw); max-height: 86vh; overflow: auto;
    padding: 20px 22px; gap: 11px;
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
  }
  .qcard--big .qcard__q { font-size: 15.5px; }
  .qcard--big .qcard__n { font-size: 11px; }
  .qcard--big .qopt { padding: 12px 14px; font-size: 13.5px; border-radius: 12px; }
  .qcard--big input { padding: 11px 12px; font-size: 13.5px; }
  .qcard {
    align-self: stretch; display: flex; flex-direction: column; gap: 7px;
    border: 1px solid var(--hairline-strong); background: var(--panel-solid);
    border-radius: var(--r-md); padding: 11px;
  }
  .qcard__head { display: flex; gap: 8px; align-items: flex-start; }
  .qcard__n {
    flex: none; font: 600 10px var(--mono); color: var(--warn);
    border: 1px solid rgba(251,191,36,.35); border-radius: 6px; padding: 2px 6px; margin-top: 1px;
  }
  .qcard__q { flex: 1; min-width: 0; font: 600 12.5px var(--font); line-height: 1.5; }
  .qcard__head .ibtn { width: 22px; height: 22px; margin: -2px -2px 0 0; }
  .qopt {
    text-align: left; display: flex; align-items: baseline; gap: 8px;
    border: 1px solid var(--hairline); background: var(--panel);
    border-radius: 10px; padding: 8px 10px; cursor: pointer;
    color: var(--text-2); font: 400 12.5px/1.45 var(--font);
    transition: border-color .16s var(--ease), background-color .16s var(--ease), color .16s var(--ease);
  }
  .qopt:hover { border-color: rgba(139,124,255,.55); background: var(--accent-soft); color: var(--text); }
  .qopt__k {
    margin-left: auto; flex: none; font: 600 10px var(--mono); color: var(--text-3);
    border: 1px solid var(--hairline); border-radius: 5px; padding: 1px 5px;
  }
  .qcard input {
    width: 100%; font: 400 12.5px var(--font); color: var(--text);
    background: rgba(0,0,0,.3); border: 1px solid var(--hairline);
    border-radius: 8px; padding: 8px 10px;
  }
  .qcard__foot { display: flex; gap: 6px; align-items: center; margin-top: 2px; }
  .chatfoot {
    flex: none; border-top: 1px solid var(--hairline);
    background: rgba(10,10,16,.66);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    padding: 9px 10px 10px; display: flex; flex-direction: column; gap: 7px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip {
    border: 1px solid var(--hairline); background: var(--panel);
    color: var(--text-2); border-radius: var(--r-pill);
    padding: 3px 10px; font: 500 11px var(--font); cursor: pointer;
    transition: color .16s var(--ease), border-color .16s var(--ease), background-color .16s var(--ease);
  }
  .chip:hover:not(:disabled) { color: var(--text); border-color: rgba(139,124,255,.55); background: var(--accent-soft); }
  .chip:disabled { opacity: .4; cursor: default; }
  /* "+ Add": attach photos or files to the next message */
  .chip--add { border-style: dashed; border-color: rgba(139,124,255,.45); color: #cfc8ff; }
  .attach { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
  .afile {
    display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
    border: 1px solid rgba(139,124,255,.35); background: var(--accent-soft); color: var(--text);
    border-radius: var(--r-pill); padding: 3px 4px 3px 9px; font: 500 11px var(--font);
  }
  .afile__n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }
  .afile__s { color: var(--text-3); font: 400 10px var(--mono); }
  .afile button {
    flex: none; width: 16px; height: 16px; border: 0; border-radius: 50%; padding: 0;
    background: rgba(255,255,255,.08); color: var(--text-2); cursor: pointer; line-height: 16px; font-size: 11px;
  }
  .afile button:hover { background: rgba(255,255,255,.16); color: var(--text); }
  .afile.is-up { opacity: .7; }
  .prow {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--hairline-strong); background: rgba(255,255,255,.05);
    border-radius: var(--r-md); padding: 7px 7px 7px 12px;
    transition: border-color .16s var(--ease), box-shadow .16s var(--ease);
  }
  .prow:focus-within { border-color: rgba(139,124,255,.6); box-shadow: 0 0 0 3px var(--accent-soft); }
  .spark { color: var(--accent); font-size: 13px; line-height: 21px; flex: none; }
  #prompt {
    flex: 1; min-width: 0; border: 0; outline: none; resize: none;
    background: transparent; color: var(--text);
    font: 400 13.5px/1.55 var(--font); padding: 0; max-height: 180px;
    min-height: 21px;
  }
  /* Multi-line typing pins the icons back to the bottom row. */
  .prow:has(#prompt[data-tall="1"]) { align-items: flex-end; }
  .prow:has(#prompt[data-tall="1"]) .spark { align-self: flex-start; }
  .sendbtn {
    flex: none; width: 32px; height: 32px; border: 0; border-radius: 50%;
    background: var(--primary); color: #fff; cursor: pointer;
    display: grid; place-items: center;
    transition: transform .16s var(--ease), opacity .16s var(--ease);
  }
  .sendbtn:hover:not(:disabled) { transform: translateY(-1px); background: var(--primary-hov); }
  .sendbtn:disabled { opacity: .35; cursor: default; }
  .sendbtn svg { width: 16px; height: 16px; display: block; }
  .sendbtn--stop {
    background: transparent; color: var(--text-2);
    border: 1px solid var(--hairline-strong);
  }
  .sendbtn--stop:hover { color: var(--text); background: var(--panel); }
  #prompt::placeholder { color: var(--text-3); }
  .valid { font: 400 10.5px var(--mono); color: var(--text-3); min-height: 14px; }
  .valid .v-ok { color: var(--ok); }
  .valid .v-warn { color: var(--warn); }
  .valid .v-err { color: var(--danger, #fb7185); }
  .valid [title] { cursor: help; }

  /* ---------------------------------------------------------------- misc */
  .notice { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); z-index: 40; width: min(560px, 92vw); }
  .note {
    margin: 0; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--hairline); background: var(--panel-solid);
    font-size: 12.5px; color: var(--text-2);
    display: flex; gap: 10px; align-items: flex-start;
    box-shadow: 0 14px 40px rgba(0,0,0,.5);
  }
  .note--warn { border-color: rgba(251,191,36,.4); }
  .note--error { border-color: rgba(251,113,133,.4); }
  .note b { color: var(--text); font-weight: 620; }
  .note__x { margin-left: auto; background: none; border: 0; color: var(--text-3); cursor: pointer; font-size: 15px; }

  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(70px);
    background: var(--text); color: #0a0a11; padding: 9px 16px; border-radius: 10px;
    font: 560 13px var(--font); z-index: 60; opacity: 0;
    transition: transform .2s var(--ease), opacity .2s var(--ease); pointer-events: none;
    max-width: 80vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .toast.on { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* Chat becomes a slide-over on narrower screens; sidebar stays a push panel. */
  @media (max-width: 1200px) {
    .chat {
      position: fixed; top: 52px; right: 0; bottom: 0; z-index: 20;
      box-shadow: -18px 0 50px rgba(0,0,0,.45); background: var(--panel-solid);
    }
    .shell[data-chat="closed"] .chat { transform: translateX(100%); width: var(--chat); opacity: 1; border-left: 1px solid var(--hairline); }
    .shell[data-chat="open"] .chat { transform: translateX(0); }
  }
  @media (max-width: 940px) {
    /* Stacked mode puts .top back in flow, where the fixed site bar would
       cover it - so reserve the bar's height on the body instead. */
    body { overflow: auto; padding-top: var(--navh); }
    .top { position: sticky; }
    .shell { position: static; flex-direction: column; }
    .main { flex-direction: column; }
    .editor, .preview, .source { border-right: 0; border-bottom: 1px solid var(--hairline); }
    .edbox { min-height: 44vh; }
  }
  /* Phones: the toolbar (name, view switch, Copy, Download, assistant) is
     wider than the screen in one row - and a row that cannot shrink widens
     the whole page, pushing the site menu off the right edge. Let it wrap. */
  @media (max-width: 560px) {
    .top { flex-wrap: wrap; height: auto; row-gap: 8px; padding-top: 8px; padding-bottom: 8px; }
    .top .sp { display: none; }
    .top #viewmode { margin-left: auto; }
  }

  /* Tablet and phone: the assistant is a bottom sheet, collapsed until the
     toolbar's ✦ opens it; the scrim, × or Escape close it. It sits on top
     of the page rather than in the layout, so the editor keeps the screen. */
  .sheet-scrim, .sheet-grip, .sheet-x { display: none; }
  @media (max-width: 940px) {
    .shell .chat, .shell[data-islands="1"] .chat, .shell[data-chat="closed"] .chat {
      position: fixed; left: 0; right: 0; top: auto; bottom: 0; z-index: 70;
      width: 100%; height: min(82svh, 680px); opacity: 1;
      border: 1px solid var(--hairline-strong); border-bottom: 0;
      border-radius: 20px 20px 0 0;
      background: var(--panel-solid); backdrop-filter: none; -webkit-backdrop-filter: none;
      box-shadow: 0 -24px 60px rgba(0,0,0,.55);
      transform: translateY(100%); transition: transform .3s var(--ease);
      pointer-events: none;
    }
    .shell[data-chat="open"] .chat { transform: none; pointer-events: auto; }
    .shell .chat .inner { width: 100%; }
    .sheet-grip { display: block; width: 38px; height: 4px; border-radius: 4px; background: var(--hairline-strong); margin: 8px auto 0; flex: none; }
    .sheet-x {
      display: grid; place-items: center; flex: none; width: 30px; height: 30px; margin-left: 8px;
      border: 1px solid var(--hairline); border-radius: 50%; background: var(--panel);
      color: var(--text-2); font-size: 18px; line-height: 1; cursor: pointer;
    }
    .sheet-x:hover { color: var(--text); background: var(--panel-raised); }
    .sheet-scrim {
      display: block; position: fixed; inset: 0; z-index: 65;
      background: rgba(4,4,8,.55); opacity: 0; pointer-events: none; transition: opacity .3s var(--ease);
    }
    .shell[data-chat="open"]:not([data-nochat="1"]) .sheet-scrim { opacity: 1; pointer-events: auto; }
  }
  @media (max-width: 940px) and (prefers-reduced-motion: reduce) {
    .shell .chat, .sheet-scrim { transition: none; }
  }

  /* ---------------------------------------------------------------- subtop */
  .subtop {
    position: fixed; top: calc(var(--navh) + 52px); left: 0; right: 0; height: 48px; z-index: 9;
    display: none; align-items: center; gap: 6px; padding: 0 14px;
    background: rgba(10,10,16,.58);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  }
  body.mode-ui.subtop-on .subtop { display: flex; }
  body.mode-ui.subtop-on .shell { inset: calc(var(--navh) + 100px) 0 0 0; }
  body.mode-ui.subtop-on .side { top: calc(var(--navh) + 100px); }
  .subtop .folder__path {
    max-width: 180px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; direction: rtl;
    font: 400 11px var(--mono); color: var(--text-2);
  }
  .subtop-div { width: 1px; height: 18px; background: var(--hairline); flex: none; margin: 0 4px; }
  /* .kitsel is width:100% because it fills the landing card. In this row that
     stretched both selects end to end, so size them to their content here. */
  .subtop .kitsel {
    padding: 5px 28px 5px 10px; font-size: 12px;
    flex: none; width: auto; min-width: 128px; max-width: 220px;
  }
  @media (max-width: 940px) {
    body.mode-ui.subtop-on .shell { position: static; }
    body.mode-ui.subtop-on .subtop { position: sticky; }
  }
</style>
</head>
<body>

<!-- -------------------------------------------------------------- topbar -->
<div id="site-nav"></div>

<header class="top">
  <span class="modetag" id="modetag"></span>
  <input id="title" value="" spellcheck="false" aria-label="Document name">
  <span class="status" id="status"></span>
  <span class="sp"></span>
  <span class="mode" id="viewmode" role="group" aria-label="View">
    <button data-v="edit">Edit</button>
    <button data-v="split">Split</button>
    <button data-v="preview">Preview</button>
  </span>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12.5 5.5 19 12l-6.5 6.5"/></svg>

<script src="/vendor/markdown-it.min.js"></script>

<script src="/md.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  var MODE = { '/text': 'text', '/ui': 'ui', '/figma': 'figma', '/convert': 'convert' }[location.pathname] || 'text';
  document.body.classList.add('mode-' + MODE);

  var TAGS = { text: 'TEXT → MD', ui: 'UI → MD', figma: 'FIGMA → MD', convert: 'FILE → MD' };

  function docSvg(color, letter, fs) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="1.7" stroke-linejoin="round">' +
      '<path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7z"/><path d="M14 2v5h5"/>' +
      '<text x="12" y="17.5" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="' + (fs || 8) +
      '" font-weight="700" fill="' + color + '" stroke="none">' + letter + '</text></svg>';
  }
  var CONVERT_ACCEPT = {
    pdf: '.pdf', word: '.docx,.doc,.rtf', excel: '.xlsx,.csv,.tsv', ppt: '.pptx',
    file: '.docx,.doc,.rtf,.xlsx,.csv,.tsv,.pptx,.pdf,.html,.htm,.txt,.md',
  };
  var CONVERT_TYPES = {
    pdf: { label: 'PDF', exts: '.pdf', color: '#fb7185', tint: 'rgba(251,113,133,.1)', line: 'rgba(251,113,133,.28)',
      svg: docSvg('#fb7185', 'PDF', 6),
      desc: 'Convert a PDF into clean, editable Markdown - running headers, footers and page numbers stripped, paragraphs stitched back together.' },
    word: { label: 'Word', exts: '.docx · .doc · .rtf', color: '#4f8ff7', tint: 'rgba(79,143,247,.1)', line: 'rgba(79,143,247,.28)',
      svg: docSvg('#4f8ff7', 'W'),
      desc: 'Convert a Word document into clean Markdown - real headings, lists and tables, none of the layout junk.' },
    excel: { label: 'Excel', exts: '.xlsx · .csv · .tsv', color: '#21A366', tint: 'rgba(33,163,102,.1)', line: 'rgba(33,163,102,.28)',
      svg: docSvg('#21A366', 'X'),
      desc: 'Turn a workbook into Markdown tables - one section per sheet, empty rows and styling junk dropped.' },
    ppt: { label: 'PowerPoint', exts: '.pptx', color: '#ed6c47', tint: 'rgba(237,108,71,.1)', line: 'rgba(237,108,71,.28)',
      svg: docSvg('#ed6c47', 'P'),
      desc: 'Turn a slide deck into structured Markdown - one section per slide, speaker notes kept as notes.' },
    file: { label: 'File', exts: 'docx · xlsx · csv · pptx · pdf · html · txt', color: '#8b7cff', tint: 'rgba(139,124,255,.12)', line: 'rgba(139,124,255,.3)',
      svg: docSvg('#8b7cff', '?', 9),
      desc: 'Convert a Word, Excel, PowerPoint, PDF, CSV or HTML file into clean, junk-free Markdown.' },
  };
  var CT = CONVERT_TYPES[new URLSearchParams(location.search).get('type')] || CONVERT_TYPES.file;
  if (MODE === 'convert') TAGS.convert = CT.label.toUpperCase() + ' → MD';
  var MD_SVG = '<svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2.5" fill="none" stroke="#8b7cff" stroke-width="1.7"/>' +
    '<path d="M6 15.5v-7l2.6 3 2.6-3v7" fill="none" stroke="#8b7cff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<path d="M17 8.5v5.5m0 0-2-2m2 2 2-2" fill="none" stroke="#8b7cff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var FIGMA_SVG = '<svg viewBox="0 0 24 24"><path fill="#F24E1E" d="M12 2H8.5a3.5 3.5 0 0 0 0 7H12V2z"/><path fill="#FF7262" d="M12 2h3.5a3.5 3.5 0 0 1 0 7H12V2z"/><path fill="#A259FF" d="M12 9H8.5a3.5 3.5 0 0 0 0 7H12V9z"/><path fill="#0ACF83" d="M8.5 16a3.5 3.5 0 1 0 3.5 3.5V16H8.5z"/><circle fill="#1ABCFE" cx="15.5" cy="12.5" r="3.5"/></svg>';

  // The active AI provider's name, from /api/setup.
  function aiName() { return S.aiLabel || 'AI'; }

  var S = {
    // The assistant starts open beside the editor on desktop, and collapsed
    // (a bottom sheet waiting for ✦) on tablet and phone.
    view: 'split', side: false, chat: !(window.matchMedia && window.matchMedia('(max-width: 940px)').matches),
    md: '', before: null, pending: false, busy: false, last: null, q: null,
    // folder upload in progress (public mode): { name, done, total, failed, ctrl }
    upload: null,
    // public Figma: the visitor's token (this tab's memory only) and link draft
    figmaToken: '', figUrlDraft: '', figError: null,
    // Text mode: files attached to the next message - { id, name, size, image, path, up }
    attach: [],
    // text
    docs: [], docName: null, mtime: 0, dirty: false, filter: '',
    // ui
    importDir: null, components: [], groups: null, current: null, curName: '', curType: null,
    kits: [], kit: null,
    demo: false,                                  // "See how it works": the built-in sample kit, no folder, no AI
    figDemo: false,                               // Figma "See how it works": the sample frame board is showing
    uiDocs: {},                                   // component -> generated markdown
    // figma
    frames: [], curFrame: null, frameDocs: {},    // url -> markdown
    log: [],                                      // chat messages
    qBig: false,                                  // clarifications shown as a fullscreen popup
    qList: null,                                  // outstanding clarification questions for the open doc
  };

  /* ================================================================ util */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  var toastT = null;
  function toast(msg) {
    var el = $('toast');
    el.textContent = msg; el.classList.add('on');
    clearTimeout(toastT);
    toastT = setTimeout(function () { el.classList.remove('on'); }, 2400);
  }
  function notify(kind, title, msg) {
    $('notice').innerHTML =
      '<div class="note note--' + kind + '"><div><b>' + esc(title) + '</b> ' + esc(msg) + '</div>' +
      '<button class="note__x" aria-label="Dismiss">&times;</button></div>';
    var x = $('notice').querySelector('.note__x');
    if (x) x.onclick = function () { $('notice').innerHTML = ''; };
    clearTimeout(notify._t);
    notify._t = setTimeout(function () { $('notice').innerHTML = ''; }, 12000);
  }
  async function api(path, opts) {
    var res = await fetch(path, Object.assign({ cache: 'no-store' }, opts || {}));
    var j = null;
    try { j = await res.json(); } catch (e) { /* non-JSON */ }
    if (!res.ok) {
      var e = new Error((j && j.error) || ('request failed with ' + res.status));
      e.status = res.status;
      e.payload = j || {};
      throw e;
    }
    return j;
  }
  function isAbort(e) { return e && (e.name === 'AbortError' || /abort/i.test(String(e.message || ''))); }
  function post(path, body, abortable) {
    if (abortable) {
      S.ctrl = new AbortController();
      return api(path, {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify(body || {}), signal: S.ctrl.signal,
      });
    }
    return postPlain(path, body);
  }
  function postPlain(path, body) {
    return api(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) });
  }
  function ago(ms) {
    var s = Math.round((Date.now() - ms) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.round(s / 60) + 'm ago';
    if (s < 86400) return Math.round(s / 3600) + 'h ago';
    return Math.round(s / 86400) + 'd ago';
  }
  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }
  // The file-name field is as wide as its text: start from a ch estimate,
  // then grow to the measured width (wide capitals outrun the ch guess).
  function sizeTitle(t) {
    t.style.width = Math.min(30, Math.max(4, (t.value || '').length + 1)) + 'ch';
    if (t.offsetParent && t.scrollWidth > t.clientWidth) t.style.width = (t.scrollWidth + 6) + 'px';
  }

  /* ============================================================ markdown */
  var md = window.ilovemdMarkdown;   // md.js

  /* =============================================================== chat */
  function say(who, text, err) {
    S.log.push({ who: who, text: text, err: !!err, ts: Date.now() });
    paintChat();
  }
  var PACTS =
    '<div class="pacts">' +
    '<button class="ibtn" id="btn-keep" title="Good - keep this result" aria-label="Like and keep">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/><path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg></button>' +
    '<button class="ibtn" id="btn-discard" title="Not good - discard and restore your previous text" aria-label="Dislike and discard">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3H10z"/><path d="M17 2h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"/></svg></button>' +
    '<button class="ibtn" id="btn-again" title="Retry" aria-label="Retry">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 3v4.2h-4.2"/></svg></button>' +
    '</div>';

  function paintChat() {
    var box = $('msgs');
    if (!S.log.length && !S.q) {
      var hint = MODE === 'text'
        ? 'Describe a document to create it, or open one and tell me how to change it.'
        : MODE === 'ui'
          ? 'Pick a component and generate its documentation - then tell me how to improve it, or ask about it.'
          : 'Paste a Figma frame link and generate - then tell me how to improve the result.';
      box.innerHTML = '<div class="chatempty">&#10022;<br>' + hint + '</div>';
      paintQModal();
    } else {
      // Keep / discard / regenerate icons sit under the last bubble; an active
      // clarification question renders below them as a card.
      box.innerHTML = S.log.map(function (m) {
        return '<div class="msg msg--' + (m.who === 'u' ? 'u' : 'a') + (m.err ? ' msg--err' : '') + '">' +
          (m.who === 'u' ? esc(m.text) : m.text) + '</div>';
      }).join('') + (S.pending ? PACTS : '') + (S.qBig ? '' : qcardHTML(false));
      if (S.pending) {
        $('btn-keep').onclick = keep;
        $('btn-discard').onclick = discard;
        $('btn-again').onclick = regen;
      }
      if (!S.qBig) bindQcard();
      box.scrollTop = box.scrollHeight;
    }
    paintQModal();
    paintChips();
  }

  /* ================================================== clarification panel
     The generated document may end with "## Open questions" (numbered items,
     optionally with suggested answers as "-" bullets). They become a Claude-
     style question card: pick an option, type your own, skip, or go back.
     Collected answers are applied to the document in one edit. */
  function parseQuestions(text) {
    var lines = String(text || '').split('\n');
    var inQ = false, out = [], cur = null;
    for (var i = 0; i < lines.length; i++) {
      var l = lines[i];
      if (/^##\s+open questions\s*$/i.test(l.trim())) { inQ = true; continue; }
      if (!inQ) continue;
      if (/^#{1,6}\s/.test(l)) break;
      var q = l.match(/^\s*\d+[.)]\s+(.+)$/);
      var o = l.match(/^\s*[-*]\s+(.+)$/);
      if (q) { cur = { text: q[1].trim(), options: [] }; out.push(cur); }
      else if (o && cur && cur.options.length < 4) cur.options.push(o[1].trim());
    }
    return out;
  }
  function startQuestions(auto) {
    var list = (S.qList && S.qList.length) ? S.qList.slice() : parseQuestions(S.md);
    if (!list.length) {
      if (!auto) toast('No open questions for this document');
      return;
    }
    S.q = { list: list, at: 0, answers: new Array(list.length).fill(null) };
    S.qBig = false;
    paintChat();
  }
  function qcardHTML(big) {
    if (!S.q) return '';
    var q = S.q.list[S.q.at];
    return '<div class="qcard' + (big ? ' qcard--big' : '') + '">' +
      '<div class="qcard__bar">' +
      '<span class="qcard__title">Clarifications</span>' +
      '<span class="sp"></span>' +
      '<button class="ibtn" id="q-expand" title="' + (big ? 'Collapse into the chat' : 'Expand to full screen') + '">' +
      (big
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M10 14l-7 7"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-8 8M3 21l8-8"/></svg>') +
      '</button>' +
      '<button class="ibtn" id="q-close" title="Dismiss - markers stay in the document">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
      '</div>' +
      '<div class="qcard__head">' +
      '<span class="qcard__n">' + (S.q.at + 1) + '/' + S.q.list.length + '</span>' +
      '<span class="qcard__q">' + esc(q.text) + '</span>' +
      '</div>' +
      q.options.map(function (o, i) {
        return '<button class="qopt" data-qo="' + i + '"><span>' + esc(o) + '</span><span class="qopt__k">' + (i + 1) + '</span></button>';
      }).join('') +
      '<input id="q-other" type="text" spellcheck="false" placeholder="Type your own answer here" autocomplete="off">' +
      '<div class="qcard__foot">' +
      (S.q.at > 0 ? '<button class="btn btn--ghost btn--sm" id="q-back">Back</button>' : '') +
      '<span class="sp"></span>' +
      '<button class="btn btn--ghost btn--sm" id="q-skip">Skip</button>' +
      '<button class="btn btn--primary btn--sm" id="q-submit">Submit</button>' +
      '</div></div>';
  }
  function paintQModal() {
    var host = $('qmodal');
    if (S.q && S.qBig) {
      host.innerHTML = '<div class="qoverlay" id="qoverlay">' + qcardHTML(true) + '</div>';
      bindQcard();
      $('qoverlay').addEventListener('pointerdown', function (e) {
        if (e.target === $('qoverlay')) { S.qBig = false; paintChat(); }
      });
      var inp = $('q-other');
      if (inp) inp.focus();
    } else {
      host.innerHTML = '';
    }
  }
  function bindQcard() {
    if (!S.q) return;
    var q = S.q.list[S.q.at];
    Array.prototype.forEach.call(document.querySelectorAll('[data-qo]'), function (b) {
      b.onclick = function () { answerQ(q.options[Number(b.getAttribute('data-qo'))]); };
    });
    $('q-expand').onclick = function () {
      S.qBig = !S.qBig;
      paintChat();
    };
    $('q-close').onclick = function () {
      S.q = null; S.qBig = false;
      say('a', 'Questions dismissed - the "Needs review" markers stay in the document. ' +
        'Use the <b>Answer open questions</b> chip to pick this up again.');
    };
    $('q-skip').onclick = function () { answerQ(null); };
    $('q-submit').onclick = function () {
      var v = $('q-other').value.trim();
      if (!v) { $('q-other').focus(); return; }
      answerQ(v);
    };
    var back = $('q-back');
    if (back) back.onclick = function () { S.q.at--; paintChat(); };
    $('q-other').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); $('q-submit').click(); }
    });
  }
  function answerQ(value) {
    S.q.answers[S.q.at] = value;
    if (S.q.at + 1 < S.q.list.length) {
      S.q.at++;
      paintChat();
      return;
    }
    var pairs = [];
    var remaining = [];
    for (var i = 0; i < S.q.list.length; i++) {
      if (S.q.answers[i]) pairs.push({ q: S.q.list[i].text, a: S.q.answers[i] });
      else remaining.push(S.q.list[i]);
    }
    S.qList = remaining;
    S.q = null; S.qBig = false;
    paintChat();
    if (!pairs.length) {
      say('a', 'All questions skipped - the "Needs review" markers stay in place.');
      return;
    }
    applyAnswers(pairs);
  }
  async function applyAnswers(pairs) {
    if (S.busy) return;
    S.busy = true;
    if (!S.pending) S.before = S.md;
    say('u', 'Answered ' + pairs.length + ' question' + (pairs.length > 1 ? 's' : '') + ' - apply to the document');
    paintTop(); paintChips();

    var instruction = [
      'Apply the following answers to the document.',
      '',
      pairs.map(function (p) { return 'Q: ' + p.q + '\nA: ' + p.a; }).join('\n\n'),
      '',
      'Rules:',
      '* Fill ONLY the sections each answer belongs to (their bodies may currently be empty).',
      '* Write no more than the answer says - do not embellish it.',
      '* Keep every section heading in place, including ones that stay empty.',
      '* Change nothing else.',
    ].join('\n');

    var t0 = Date.now();
    var tick = setInterval(function () {
      $('valid').innerHTML = '<span style="color:var(--accent)">&#9679;</span> Applying your answers… ' + Math.round((Date.now() - t0) / 1000) + 's';
    }, 500);
    try {
      var r = S.demo
        ? await demoApply(S.md, pairs)
        : await post('/api/ai', { instruction: instruction, mode: 'edit', markdown: S.md }, true);
      clearInterval(tick);
      if (r.markdown && r.markdown.trim()) {
        S.md = r.markdown;
        stash();
        S.pending = true; S.dirty = true;
        S.last = null;
        setStatus('dirty', '');
        paintEditor(); paintPreview();
        say('a', '<b>Applied your answers</b> in ' + Math.round((Date.now() - t0) / 1000) + 's' +
          (r.touched && r.touched.length ? ' - updated <b>' + r.touched.map(esc).join('</b>, <b>') + '</b>' : '') +
          '. Review the patched sections, then <b>Keep</b> or <b>Discard</b>.');
      } else {
        say('a', aiName() + ' returned nothing. Your text is unchanged.', true);
      }
    } catch (e) {
      clearInterval(tick);
      if (isAbort(e)) {
        say('a', 'Stopped. The answers were not applied.');
      } else {
        var p = e.payload || {};
        say('a', '<b>Could not apply the answers.</b> ' + esc(p.explain || e.message), true);
      }
    }
    S.busy = false;
    validate(); paintTop(); paintChat();
  }
  function paintChips() {
    var defs = [];
    if (!S.busy) {
      if (MODE === 'ui' && S.current && !S.md) {
        defs = [{ label: 'Generate documentation', gen: true }];
      } else if (!S.md && MODE === 'text') {
        defs = [

  /* Text mode's empty-editor prompt types itself in, after Magic UI's
     TypingAnimation, at twice its default speed: 50ms a character, then a line cursor that blinks while
     the editor is empty and unfocused (focused, the real caret takes over).
     It types once per page load; later repaints show it whole. */
  var PH_TEXT = 'Write here, or ask the assistant →';
  var PH_TYPE_MS = 50, PH_BLINK_MS = 530, PH_CURSOR = '|';
  var phTyped = false, phTimer = null;
  function typePlaceholder(ta) {
    clearTimeout(phTimer);
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      ta.placeholder = PH_TEXT; phTyped = true; return;
    }
    var n = phTyped ? PH_TEXT.length : 0, on = true;
    (function step() {
      if (!ta.isConnected) return;   // repainted: the new editor runs its own
      if (n < PH_TEXT.length) {
        ta.placeholder = PH_TEXT.slice(0, ++n) + PH_CURSOR;
        phTimer = setTimeout(step, PH_TYPE_MS);
        return;
      }
      phTyped = true;
      ta.placeholder = PH_TEXT + (on && document.activeElement !== ta ? PH_CURSOR : '');
      on = !on;
      phTimer = setTimeout(step, PH_BLINK_MS);
    })();
  }

  function paintPreview() {
    $('prevbody').innerHTML = S.md
      ? '<div class="md">' + md(S.md) + '</div>'
      : '<div class="placeholder"><div><div class="big">&#10022;</div>Nothing to preview yet.</div></div>';
  }

  /* Live CommonMark check (mdcheck.js on markdown-it, the same parser the
     server checks every generated document with). The result sits in the
     editor header - hover for the list, click to jump from issue to issue -
     and each problem line gets a marker in the gutter. If the parser failed
     to load, it says so rather than claiming a check that did not run. */
  var mdIt = window.markdownit && window.ilovemdCheck ? window.markdownit({ html: true }) : null;
  S.issues = []; S.issueAt = -1;
  function validate() {
    var el = $('chk');
    if (!S.busy) $('valid').innerHTML = '';   // that line is the "writing…" progress now
    $('chknav').hidden = true;
    if (!S.md) { el.hidden = true; S.issues = []; paintGutter(); return; }
    el.hidden = false;
    if (!mdIt) { el.className = 'chk'; el.textContent = 'check unavailable'; el.title = 'The CommonMark parser did not load.'; return; }
    var r = window.ilovemdCheck.check(mdIt, S.md);
    S.issues = r.issues; S.issueAt = -1;
    paintGutter();
    if (!r.issues.length) {
      el.className = 'chk chk--ok';
      el.innerHTML = '&#10003; CommonMark';
      el.title = 'Parsed with a CommonMark-compliant parser: fences closed, tables consistent, headings in order.';
      return;
    }
    var errs = r.issues.filter(function (x) { return x.level === 'error'; }).length;
    el.className = 'chk ' + (errs ? 'chk--err' : 'chk--warn');
    el.dataset.icon = errs ? '&#10005; ' : '&#9888; ';
    el.innerHTML = el.dataset.icon + r.issues.length + (r.issues.length === 1 ? ' issue' : ' issues');
    $('chknav').hidden = !r.issues.some(function (x) { return x.line > 0; });
    el.title = r.issues.map(function (x) {
      return (x.level === 'error' ? '✕ ' : '⚠ ') + (x.line ? 'Line ' + x.line + ': ' : '') + x.msg;
    }).join('\n') + '\n\nClick to jump to the next one.';
  }
  // Line numbers and markers in the editor gutter (see .edbox).
  function paintGutter() {
    var ta = $('ed'), bk = $('edbk');
    if (!ta || !bk) return;
    var by = {};
    (S.issues || []).forEach(function (x) { if (x.line > 0) (by[x.line] = by[x.line] || []).push(x); });
    var lines = ta.value.split('\n'), out = new Array(lines.length);
    for (var i = 0; i < lines.length; i++) {
      var n = i + 1, iss = by[n];
      var lvl = iss ? (iss.some(function (x) { return x.level === 'error'; }) ? 'err' : 'warn') : '';
      out[i] = '<div class="ln' + (lvl ? ' ln--' + lvl : '') + '" data-n="' + n + '">' +
        (lvl ? '<span class="ln__mk ln__mk--' + lvl + '" title="' + esc(iss.map(function (x) { return x.msg; }).join('\n')) + '">' +
          (lvl === 'err' ? '&#10005;' : '&#9888;') + '</span>' : '') +
        (esc(lines[i]) || '\u200b') + '</div>';
    }
    bk.innerHTML = out.join('');
    bk.style.setProperty('--sbw', (ta.offsetWidth - ta.clientWidth) + 'px');
    bk.scrollTop = ta.scrollTop;
  }
  // ▲ ▼ (and a click on the badge): select the previous / next problem line,
  // top to bottom, and show where we are - "3 / 12" - like a find bar.
  function jumpIssue(step) {
    var withLine = (S.issues || []).filter(function (x) { return x.line > 0; })
      .sort(function (a, b) { return a.line - b.line; });
    var ta = $('ed');
    if (!withLine.length || !ta) return;
    S.issueAt = S.issueAt < 0 ? (step > 0 ? 0 : withLine.length - 1) : (S.issueAt + step + withLine.length) % withLine.length;
    var el = $('chk');
    el.innerHTML = (el.dataset.icon || '') + (S.issueAt + 1) + ' / ' + withLine.length;
    var n = withLine[S.issueAt].line, lines = ta.value.split('\n'), start = 0;
    for (var i = 0; i < n - 1 && i < lines.length; i++) start += lines[i].length + 1;
    ta.focus();
    ta.setSelectionRange(start, start + (lines[n - 1] || '').length);
    var row = $('edbk').querySelector('.ln[data-n="' + n + '"]');
    if (row) ta.scrollTop = Math.max(0, row.offsetTop - 60);
    $('edbk').scrollTop = ta.scrollTop;   // don't wait for the scroll event
  }
  $('chk').onclick = function () { jumpIssue(1); };
  $('chk-next').onclick = function () { jumpIssue(1); };
  $('chk-prev').onclick = function () { jumpIssue(-1); };

  /* "Fix it": a deterministic repair when the problem has exactly one right
     answer (mdcheck fixIssue), applied as a normal edit so Cmd+Z undoes it;
     otherwise the assistant is asked to fix just that line. */
  function fixLine(n) {
    var ta = $('ed');
    if (!ta || !mdIt) return;
    var here = (S.issues || []).filter(function (x) { return x.line === n; });
    for (var i = 0; i < here.length; i++) {
      var e = window.ilovemdCheck.fixIssue(ta.value, here[i]);
      if (!e) continue;
      ta.focus();
      ta.setSelectionRange(e.start, e.end);
      var done = e.text ? document.execCommand('insertText', false, e.text) : document.execCommand('delete');
      if (!done) { ta.setRangeText(e.text, e.start, e.end, 'end'); ta.dispatchEvent(new Event('input')); }
      S.md = ta.value;
      validate();
      toast('Fixed: ' + here[i].msg.replace(/ on line \d+/, ''));
      return;
    }
    if (!here.length || S.busy) return;
    S.chat = true; paintTop();
    $('prompt').value = 'Fix only line ' + n + ' of the document: ' + here.map(function (x) { return x.msg; }).join(' ') +
      ' Change nothing else - keep every other line exactly as it is.';
    send(false);
  }

  async function openDoc(name) {
    if (S.dirty && S.md && !window.confirm('Discard unsaved changes?')) return;
    S.q = null; S.qList = null;
    try {
      var r = await api('/api/doc?name=' + encodeURIComponent(name));
      S.docName = r.name; S.mtime = r.mtime; S.dirty = false;
      S.before = null; S.pending = false;
      setDoc(r.markdown, r.name);
      setStatus('', 'saved ' + ago(r.mtime));
      paintSidebar();
    } catch (e) { notify('error', 'Could not open that document.', e.message); }
  }
  function newDoc() {
    if (S.dirty && S.md && !window.confirm('Discard unsaved changes?')) return;
    S.q = null; S.qList = null;
    S.docName = null; S.mtime = 0; S.dirty = false; S.before = null; S.pending = false;
    setDoc('', MODE === 'text' ? 'untitled.md' : '');
    setStatus('', '');
    paintSidebar();
    $('prompt').focus();
  }
  function currentName() {

  // Waits like a real request does, and Cancel / Stop abort it the same way.
  function demoWait(ms) {
    S.ctrl = new AbortController();
    var sig = S.ctrl.signal;
    return new Promise(function (done, fail) {
      var t = setTimeout(done, ms);
      sig.addEventListener('abort', function () {
        clearTimeout(t);
        var e = new Error('aborted'); e.name = 'AbortError'; fail(e);
      });
    });
  }
  async function demoGenerate(d) {
    var t0 = Date.now();
    await demoWait(5200);
    return {
      markdown: d.md.join('\n'),
      questions: d.questions.map(function (q) { return { text: q.text, options: q.options.slice() }; }),
      ms: Date.now() - t0,
    };
  }
  // Each answer adds its line(s) at the end of the section its question names.
  function demoInsert(src, heading, add) {
    var lines = src.split('\n');
    var at = lines.findIndex(function (l) { return l.trim() === heading; });
    if (at === -1) return src;
    var end = at + 1;
    while (end < lines.length && !/^#{1,6}\s/.test(lines[end])) end++;
    while (end > at + 1 && !lines[end - 1].trim()) end--;
    return lines.slice(0, end).concat(add).concat(lines.slice(end)).join('\n');
  }
  async function demoApply(src, pairs) {
    await demoWait(1600);
    var qs = ((MODE === 'figma' ? FIG_DEMO : DEMO[S.current]) || {}).questions || [], touched = [];
    pairs.forEach(function (p) {
      var q = qs.find(function (x) { return x.text === p.q; });
      if (!q) return;
      var i = q.options.indexOf(p.a);
      var typed = p.a.trim().replace(/^(yes|no)\b[\s,.:;-]*/i, '') || p.a.trim();   // "Yes, a badge" -> "A badge"
      var add = i >= 0 ? q.add[i] : ['- ' + cap(typed) + (/[.!?]$/.test(typed) ? '' : '.')];
      if (!add.length) return;
      src = demoInsert(src, q.sec, add);
      var label = q.sec.replace(/^#+\s*/, '');
      if (touched.indexOf(label) === -1) touched.push(label);
    });
    return { markdown: src, touched: touched };
  }

  async function uploadKitFolder(fileList) {
    if (S.upload) return;
    var files = Array.prototype.filter.call(fileList || [], function (f) { return /\.(html?|css)$/i.test(f.name); });
    if (!files.length) { notify('warn', 'No HTML/CSS files found', 'Pick a folder that contains component markup.'); return; }
    var kitName = ((files[0].webkitRelativePath || files[0].name).split('/')[0] || 'kit').slice(0, 60);
    var up = S.upload = { name: kitName, done: 0, total: files.length, failed: 0, ctrl: new AbortController() };
    document.body.classList.add('is-uploading');
    paintEditor();
    var dir = null, stopped = '';
    for (var i = 0; i < files.length; i++) {
      if (up.ctrl.signal.aborted) break;
      var f = files[i];
      var rel = (f.webkitRelativePath || f.name).split('/').slice(1).join('/') || f.name;
      try {
        var j = await api('/api/kit-upload?kit=' + encodeURIComponent(kitName) + '&relpath=' + encodeURIComponent(rel),
          { method: 'POST', body: f, signal: up.ctrl.signal });
        if (j && j.dir) dir = j.dir;
      } catch (e) {
        if (isAbort(e)) break;
        // A rate limit fails every remaining file too - stop and say why.
        if (e.status === 429) { stopped = e.message; break; }
        up.failed++;
      }
      up.done = i + 1;
      showUploadProgress();
    }
    var cancelled = up.ctrl.signal.aborted;
    S.upload = null;
    document.body.classList.remove('is-uploading');
    paintEditor();
    if (cancelled) { toast('Upload cancelled'); return; }
    if (stopped) { notify('error', 'Upload stopped', stopped); return; }
    if (!dir) { notify('error', 'Upload failed', 'Could not upload the folder. Try again.'); return; }
    leaveDemo();
    S.importDir = dir;
    try {
      await api('/api/state', { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ importDir: dir }) });
    } catch (e) { /* non-fatal */ }
    await loadKits();
    await loadComponents();
    toast('Imported ' + files.length + ' files' + (up.failed ? ' (' + up.failed + ' failed)' : ''));
  }
