<!doctype html>
<html lang="en">
<head>
<script>/* light/dark: apply the saved choice before first paint (nav.js toggles it) */try{if(localStorage.getItem('ilovemd-theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>ilovemd · Templates</title>
<meta name="description" content="Ready-made Markdown templates for specs, docs and prompts. Preview, copy, download, or open one in the editor.">
<link rel="stylesheet" href="/nav.css">
<style>
  /* ------------------------------------------------------------ tokens
     The homepage's, so the two read as one product. */
  :root {
    --canvas: #08080c;
    --panel: rgba(255,255,255,.038);
    --panel-raised: rgba(255,255,255,.062);
    --panel-solid: #12121a;
    --hairline: rgba(255,255,255,.085);
    --hairline-strong: rgba(255,255,255,.16);
    --text: #f5f5fa;
    --text-2: #a3a3b4;
    --text-3: #6d6d7e;
    --accent: #8b7cff;
    --accent-soft: rgba(139,124,255,.16);
    --accent-2: #3fd0e0;
    --primary: #4f46e5;
    --primary-hov: #4338ca;
    --gradient: linear-gradient(135deg,#8b7cff 0%,#6f8bff 45%,#3fd0e0 100%);
    --r-sm: 8px; --r-md: 12px; --r-lg: 18px; --r-pill: 999px;
    --ease: cubic-bezier(.2,.8,.3,1);
    --font: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--canvas); color: var(--text);
    font: 400 15px/1.6 var(--font);
    overflow-x: clip; -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(52em 34em at 8% -6%, rgba(139,124,255,.15), transparent 62%),
      radial-gradient(46em 30em at 102% 104%, rgba(63,208,224,.1), transparent 60%);
  }
  a { color: var(--accent); text-decoration: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; padding: 0 24px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    border: 1px solid transparent; background: transparent; color: var(--text);
    font: 560 13px var(--font); border-radius: var(--r-pill); padding: 8px 15px;
    cursor: pointer; white-space: nowrap; text-decoration: none;
    transition: background-color .16s var(--ease), border-color .16s var(--ease), transform .16s var(--ease);
  }
  .btn:hover { transform: translateY(-1px); }
  .btn svg { width: 15px; height: 15px; flex: none; }
  .btn--stroke { border-color: var(--hairline-strong); background: var(--panel); }
  .btn--stroke:hover { background: var(--panel-raised); }
  .btn--ghost { color: var(--text-2); }
  .btn--ghost:hover { background: var(--panel); color: var(--text); }
  .btn--primary { background: var(--primary); color: #fff; font-weight: 620; }
  .btn--primary:hover { background: var(--primary-hov); }
  .btn--icon { padding: 8px; }

  /* --------------------------------------------------------------- hero
     Same dot pattern as the homepage hero, fading out from the title. */
  /* top and bottom only - .wrap owns the side gutters */
  .hero { padding-top: calc(var(--navh) + 56px); padding-bottom: 34px; text-align: center; }
  .hero::before {
    content: ''; position: absolute; z-index: -1; pointer-events: none;
    top: 0; bottom: -20px; left: 50%; width: 100vw; transform: translateX(-50%);
    background-image: radial-gradient(circle at 1px 1px, rgba(163,163,180,.36) 1px, transparent 1.25px);
    background-size: 16px 16px;
    -webkit-mask-image: radial-gradient(ellipse 55% 60% at 50% 42%, #000 15%, transparent 72%);
            mask-image: radial-gradient(ellipse 55% 60% at 50% 42%, #000 15%, transparent 72%);
  }
  .kicker {
    display: inline-block; margin-bottom: 18px;
    font: 600 11px var(--font); letter-spacing: .14em; text-transform: uppercase; color: var(--accent);
  }
  .hero h1 {
    margin: 0 auto 16px; max-width: 18ch;
    font-size: clamp(34px, 5.6vw, 58px); font-weight: 700; letter-spacing: -.035em; line-height: 1.06;
  }
  .hero h1 .grad {
    background: var(--gradient); -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .hero p { margin: 0 auto; max-width: 58ch; color: var(--text-2); font-size: 16.5px; }

  .search {
    display: block; position: relative; max-width: 520px; margin: 32px auto 0;
  }
  .search svg { position: absolute; left: 16px; top: 50%; width: 17px; height: 17px; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
  .search input {
    width: 100%; height: 48px; padding: 0 18px 0 44px;
    font: 400 14.5px var(--font); color: var(--text);
    background: rgba(18,18,26,.75); border: 1px solid var(--hairline-strong); border-radius: var(--r-pill);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    transition: border-color .16s var(--ease), box-shadow .16s var(--ease);
  }
  .search input::placeholder { color: var(--text-3); }
  .search input:focus { outline: none; border-color: rgba(139,124,255,.55); box-shadow: 0 0 0 4px rgba(139,124,255,.14); }

  /* ------------------------------------------------------------ toolbar */
  .toolbar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin: 18px 0 22px;
  }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill {
    border: 1px solid var(--hairline); background: transparent; color: var(--text-2);
    font: 500 12.5px var(--font); padding: 6px 13px; border-radius: var(--r-pill); cursor: pointer;
    transition: background-color .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease);
  }
  .pill:hover { color: var(--text); background: rgba(255,255,255,.05); }
  .pill[aria-pressed="true"] { color: var(--text); background: var(--accent-soft); border-color: rgba(139,124,255,.45); }
  .count { margin-left: auto; font: 400 12px var(--mono); color: var(--text-3); }

  /* --------------------------------------------------------------- grid */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding-bottom: 100px; }
  .card {
    position: relative; display: flex; flex-direction: column; min-height: 248px;
    border: 1px solid var(--hairline); border-radius: var(--r-lg); padding: 20px 20px 16px;
    background:
      linear-gradient(135deg, rgba(139,124,255,.05) 0%, rgba(111,139,255,.015) 40%, rgba(8,8,16,.5) 100%);
    cursor: pointer; text-align: left;
    transition: transform .2s var(--ease), border-color .2s var(--ease), background-color .2s var(--ease);
  }
  .card:hover { transform: translateY(-3px); border-color: rgba(139,124,255,.32); background-color: rgba(255,255,255,.02); }
  .card__top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .ico {
    flex: none; width: 40px; height: 40px; border-radius: 11px;
    display: grid; place-items: center; font-size: 19px; line-height: 1;
    background: var(--accent-soft); border: 1px solid rgba(139,124,255,.28);
  }
  .ico--mono { font: 700 15px var(--font); color: #cfc8ff; }
  .card h2 { margin: 0; font-size: 15.5px; font-weight: 640; letter-spacing: -.01em; line-height: 1.3; }
  .meta { font: 400 11.5px var(--mono); color: var(--text-3); margin-top: 2px; }
  .card p {
    margin: 0 0 14px; color: var(--text-2); font-size: 13.2px; line-height: 1.6;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .tag {
    font: 400 10.5px var(--mono); color: var(--text-3);
    border: 1px solid var(--hairline); border-radius: var(--r-pill); padding: 2px 8px;
  }
  .card__foot { margin-top: auto; display: flex; align-items: center; gap: 6px; }
  .card__foot .sp { flex: 1; }

  .empty {
    grid-column: 1 / -1; text-align: center; padding: 70px 20px;
    border: 1px dashed var(--hairline-strong); border-radius: var(--r-lg); color: var(--text-2);
  }
  .empty b { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }

  /* ------------------------------------------------------------ preview */
  dialog.pv {
    width: min(860px, calc(100vw - 32px)); height: min(84vh, 900px);
    padding: 0; border: 1px solid var(--hairline-strong); border-radius: var(--r-lg);
    background: #0e0e15; color: var(--text);
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
  }
  dialog.pv[open] { display: flex; flex-direction: column; animation: pvIn .22s var(--ease); }
  dialog.pv::backdrop { background: rgba(4,4,8,.66); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  @keyframes pvIn { from { opacity: 0; transform: translateY(10px) scale(.985); } }
  .pv__head {
    flex: none; display: flex; align-items: center; gap: 12px;
    padding: 16px 18px; border-bottom: 1px solid var(--hairline);
  }
  .pv__title { min-width: 0; }
  .pv__title h2 { margin: 0; font-size: 16px; font-weight: 640; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pv__head .sp { flex: 1; }
  .pv__bar { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-bottom: 1px solid var(--hairline); }
  .seg { display: inline-flex; border: 1px solid var(--hairline); border-radius: var(--r-pill); padding: 2px; }
  .seg button {
    border: 0; background: transparent; color: var(--text-2); cursor: pointer;
    font: 500 12px var(--font); padding: 5px 12px; border-radius: var(--r-pill);
  }
  .seg button[aria-pressed="true"] { background: rgba(255,255,255,.08); color: var(--text); }
  .pv__body { flex: 1; overflow: auto; padding: 26px 30px 40px; }
  .pv__raw {
    margin: 0; white-space: pre-wrap; word-break: break-word;
    font: 400 12.5px/1.7 var(--mono); color: #d4d2e6;
  }

  /* Rendered Markdown (md.js output) */
  .md { font-size: 14.5px; line-height: 1.7; color: #dcdbe8; max-width: 72ch; }
  .md > :first-child { margin-top: 0; }
  .md h1, .md h2, .md h3, .md h4 { color: var(--text); letter-spacing: -.015em; line-height: 1.25; margin: 1.6em 0 .55em; }
  .md h1 { font-size: 26px; } .md h2 { font-size: 19px; padding-bottom: 6px; border-bottom: 1px solid var(--hairline); }
  .md h3 { font-size: 15.5px; } .md h4 { font-size: 14px; color: var(--text-2); }
  .md p { margin: 0 0 1em; }
  .md ul, .md ol { margin: 0 0 1em; padding-left: 1.4em; }
  .md li { margin: .25em 0; }
  .md code { font: 400 .88em var(--mono); background: rgba(255,255,255,.06); border: 1px solid var(--hairline); border-radius: 5px; padding: 1px 5px; }
  .md pre { background: rgba(0,0,0,.35); border: 1px solid var(--hairline); border-radius: var(--r-md); padding: 14px 16px; overflow: auto; }
  .md pre code { background: none; border: 0; padding: 0; font-size: 12.5px; }
  .md blockquote { margin: 0 0 1em; padding: 4px 16px; border-left: 3px solid rgba(139,124,255,.5); color: var(--text-2); }
  .md blockquote p { margin: 0; }
  .md hr { border: 0; border-top: 1px solid var(--hairline); margin: 1.8em 0; }
  .md .tablewrap { overflow-x: auto; margin: 0 0 1em; }
  .md table { border-collapse: collapse; font-size: 13.5px; min-width: 60%; }
  .md th, .md td { border: 1px solid var(--hairline-strong); padding: 7px 11px; text-align: left; vertical-align: top; }
  .md th { background: rgba(255,255,255,.04); color: var(--text); font-weight: 600; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; z-index: 100; transform: translate(-50%, 12px);
    background: var(--panel-solid); border: 1px solid var(--hairline-strong); color: var(--text);
    font: 500 13px var(--font); padding: 9px 16px; border-radius: var(--r-pill);
    opacity: 0; pointer-events: none; transition: opacity .2s var(--ease), transform .2s var(--ease);
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 960px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 620px) {
    .grid { grid-template-columns: 1fr; }
    .hero { padding-top: calc(var(--navh) + 30px); }
    .count { width: 100%; margin-left: 0; }
    .pv__body { padding: 20px 18px 32px; }
    .pv__bar { flex-wrap: wrap; padding: 10px 14px; }
    .pv__bar .btn span { display: none; }
    .pv__bar .btn--ghost { padding: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .btn { transition: none; }
    .card:hover, .btn:hover { transform: none; }
    dialog.pv[open] { animation: none; }
  }
  /* ============================================================ light mode
     <html data-theme="light"> (sun/moon switch in the header). Same layout
     and styling as dark - only the palette changes. */
  :root[data-theme="light"] {
    color-scheme: light;
    --canvas: #f6f5fb;
    --panel: rgba(22,20,60,.035);
    --panel-raised: rgba(22,20,60,.06);
    --panel-solid: #ffffff;
    --hairline: rgba(22,20,60,.09);
    --hairline-strong: rgba(22,20,60,.16);
    --text: #16151d;
    --text-2: #55546a;
    --text-3: #8a889c;
    --accent: #6a5af0;
    --accent-soft: rgba(106,90,240,.1);
    --accent-2: #0e9fb2;
    --gradient: linear-gradient(135deg,#6a5af0 0%,#4f6ff0 45%,#0e9fb2 100%);
    --danger: #e11d48;
  }
  :root[data-theme="light"] body::before {
    background:
      radial-gradient(52em 34em at 8% -6%, rgba(106,90,240,.11), transparent 62%),
      radial-gradient(46em 30em at 102% 104%, rgba(14,159,178,.07), transparent 60%);
  }
  :root[data-theme="light"] .hero::before { background-image: radial-gradient(circle at 1px 1px, rgba(70,66,110,.28) 1px, transparent 1.25px); }
  :root[data-theme="light"] .search input { background: rgba(255,255,255,.9); }
  :root[data-theme="light"] .search input:focus { border-color: rgba(106,90,240,.5); box-shadow: 0 0 0 4px rgba(106,90,240,.12); }
  :root[data-theme="light"] .pill:hover { background: rgba(22,20,60,.05); }
  :root[data-theme="light"] .pill[aria-pressed="true"] { border-color: rgba(106,90,240,.4); }
  :root[data-theme="light"] .card { background: linear-gradient(135deg, rgba(106,90,240,.06) 0%, rgba(111,139,255,.02) 40%, rgba(255,255,255,.9) 100%); }
  :root[data-theme="light"] .card:hover { border-color: rgba(106,90,240,.35); background-color: #fff; }
  :root[data-theme="light"] .ico { border-color: rgba(106,90,240,.28); }
  :root[data-theme="light"] .ico--mono { color: #5b4ff0; }
  :root[data-theme="light"] dialog.pv { background: #ffffff; box-shadow: 0 30px 80px rgba(30,26,80,.25); }
  :root[data-theme="light"] dialog.pv::backdrop { background: rgba(30,26,60,.3); }
  :root[data-theme="light"] .seg button[aria-pressed="true"] { background: rgba(22,20,60,.07); }
  :root[data-theme="light"] .pv__raw { color: #26252f; }
  :root[data-theme="light"] .md { color: #26252f; }
  :root[data-theme="light"] .md code { background: rgba(22,20,60,.06); }
  :root[data-theme="light"] .md pre { background: rgba(22,20,60,.04); }
  :root[data-theme="light"] .md blockquote { border-left-color: rgba(106,90,240,.5); }
  :root[data-theme="light"] .md th { background: rgba(22,20,60,.04); }
</style>
</head>
<body>
<div id="site-nav"></div>

<header class="hero wrap">
  <span class="kicker">Templates</span>
  <h1>Markdown templates, <span class="grad">ready when you are.</span></h1>
  <p>Hand-built Markdown for specs, docs and prompts. Preview one, take it as it is, or open it in the editor and let AI fill in the rest.</p>
  <label class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search templates…" autocomplete="off" aria-label="Search templates">
  </label>
</header>

<main class="wrap">
  <div class="toolbar">
    <div class="pills" id="pills" role="group" aria-label="Template type"></div>
    <span class="count" id="count" aria-live="polite"></span>
  </div>
  <div class="grid" id="grid"></div>
</main>

<dialog class="pv" id="pv" aria-labelledby="pv-title">
  <div class="pv__head">
    <span class="ico" id="pv-ico"></span>
    <div class="pv__title"><h2 id="pv-title"></h2><div class="meta" id="pv-meta"></div></div>
    <span class="sp"></span>
    <button class="btn btn--ghost btn--icon" id="pv-close" aria-label="Close preview">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="pv__bar">
    <div class="seg" role="group" aria-label="View">
      <button id="pv-v-render" aria-pressed="true">Preview</button>
      <button id="pv-v-raw" aria-pressed="false">Markdown</button>
    </div>
    <span style="flex:1"></span>
    <button class="btn btn--ghost" id="pv-copy" aria-label="Copy Markdown">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg><span>Copy</span>
    </button>
    <button class="btn btn--ghost" id="pv-dl" aria-label="Download .md">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5M4 19h16"/></svg><span>Download</span>
    </button>
    <a class="btn btn--primary" id="pv-use" href="/text">Use template</a>
  </div>
  <div class="pv__body" id="pv-body"></div>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script src="/md.js"></script>
<script>
/* The templates page: cards from /api/templates, a preview dialog that loads
   one template from /api/template, and Copy / Download / Use template.
   ?q= and ?category= filter on load; ?t=<slug> opens that preview, so a
   preview can be linked to. */
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var all = [], cat = 'All', open = null, view = 'render';
  var params = new URLSearchParams(location.search);

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  var toastT;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('on'); }, 2200);
  }
  function icon(t) {
    return t.icon
      ? '<span class="ico">' + esc(t.icon) + '</span>'
      : '<span class="ico ico--mono">' + esc(t.title.charAt(0).toUpperCase()) + '</span>';
  }
  function meta(t) {
    return esc(t.category) + ' · ' + t.sections + ' section' + (t.sections === 1 ? '' : 's') + ' · ' + t.words.toLocaleString() + ' words';
  }
  function setParam(k, v) {
    var p = new URLSearchParams(location.search);
    if (v) p.set(k, v); else p.delete(k);
    var qs = p.toString();
    history.replaceState(null, '', location.pathname + (qs ? '?' + qs : ''));
  }

  // ------------------------------------------------------------- cards
  function paint() {
    var q = $('q').value.trim().toLowerCase();
    var words = q.split(/\s+/).filter(Boolean);
    var inGroup = all.filter(function (t) { return (t.group || 'md') === cat; });
    var hits = inGroup.filter(function (t) {
      var hay = (t.title + ' ' + t.description + ' ' + t.category + ' ' + t.tags.join(' ')).toLowerCase();
      return words.every(function (w) { return hay.indexOf(w) !== -1; });
    });
    var noun = cat === 'design' ? 'Design MD' : 'template';
    $('count').textContent = hits.length + ' of ' + inGroup.length + ' ' + noun + (inGroup.length === 1 || noun === 'Design MD' ? '' : 's');
    if (!inGroup.length) {
      $('grid').innerHTML = '<div class="empty"><b>' + (cat === 'design' ? 'Design MDs are on their way.' : 'Templates are on their way.') + '</b>Check back soon.</div>';
      $('count').textContent = '';
      return;
    }
    $('grid').innerHTML = hits.length ? hits.map(function (t) {
      return '<article class="card" data-slug="' + esc(t.slug) + '" tabindex="0" aria-label="Preview ' + esc(t.title) + '">' +
        '<div class="card__top">' + icon(t) + '<div><h2>' + esc(t.title) + '</h2><div class="meta">' + meta(t) + '</div></div></div>' +
        '<p>' + esc(t.description) + '</p>' +
        (t.tags.length ? '<div class="tags">' + t.tags.map(function (g) { return '<span class="tag">' + esc(g) + '</span>'; }).join('') + '</div>' : '') +
        '<div class="card__foot">' +
          '<button class="btn btn--stroke" data-act="preview">Preview</button>' +
          '<span class="sp"></span>' +
          '<a class="btn btn--ghost" data-act="use" href="/text?template=' + encodeURIComponent(t.slug) + '">Use template &rarr;</a>' +
        '</div>' +
      '</article>';
    }).join('') : '<div class="empty"><b>No templates match “' + esc(q) + '”.</b>Try another word, or clear the filters.</div>';
  }
  // Two shelves: everyday Markdown templates, and Design MDs (brand and
  // design-system context files from templates/Design systems/).
  var GROUPS = [['md', 'MD templates'], ['design', 'Design MD']];
  function paintPills() {
    if (!GROUPS.some(function (g) { return g[0] === cat; })) cat = 'md';
    $('pills').innerHTML = GROUPS.map(function (g) {
      return '<button class="pill" data-cat="' + g[0] + '" aria-pressed="' + (g[0] === cat) + '">' + esc(g[1]) + '</button>';
    }).join('');
  }

  $('pills').addEventListener('click', function (e) {
    var b = e.target.closest('.pill'); if (!b) return;
    cat = b.getAttribute('data-cat');
    setParam('category', cat === 'md' ? '' : cat);
    paintPills(); paint();
  });
  var qT;
  $('q').addEventListener('input', function () {
    paint();
    clearTimeout(qT); qT = setTimeout(function () { setParam('q', $('q').value.trim()); }, 300);
  });
  $('grid').addEventListener('click', function (e) {
    var card = e.target.closest('.card'); if (!card) return;
    if (e.target.closest('[data-act="use"]')) return;      // a real link
    preview(card.getAttribute('data-slug'));
  });
  $('grid').addEventListener('keydown', function (e) {
    var card = e.target.closest('.card');
    if (card && e.target === card && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); preview(card.getAttribute('data-slug')); }
  });

  // ------------------------------------------------------------ preview
  function paintBody() {
    $('pv-v-render').setAttribute('aria-pressed', view === 'render');
    $('pv-v-raw').setAttribute('aria-pressed', view === 'raw');
    if (!open || !open.markdown) { $('pv-body').innerHTML = '<p style="color:var(--text-3)">Loading…</p>'; return; }
    $('pv-body').innerHTML = view === 'render'
      ? '<div class="md">' + window.ilovemdMarkdown(open.markdown) + '</div>'
      : '<pre class="pv__raw">' + esc(open.markdown) + '</pre>';
    $('pv-body').scrollTop = 0;
  }
  async function preview(slug) {
    var card = all.find(function (t) { return t.slug === slug; });
    if (!card) return;
    open = { slug: slug, card: card, markdown: '' };
    $('pv-ico').outerHTML = icon(card).replace('class="ico', 'id="pv-ico" class="ico');
    $('pv-title').textContent = card.title;
    $('pv-meta').innerHTML = meta(card);
    $('pv-use').href = '/text?template=' + encodeURIComponent(slug);
    view = 'render'; paintBody();
    if (!$('pv').open) $('pv').showModal();
    setParam('t', slug);
    try {
      var r = await fetch('/api/template?slug=' + encodeURIComponent(slug), { cache: 'no-store' });
      if (!r.ok) throw new Error('not found');
      var j = await r.json();
      if (open && open.slug === slug) { open.markdown = j.markdown; paintBody(); }
    } catch (e) {
      $('pv-body').innerHTML = '<p style="color:var(--text-3)">This template could not be loaded. Try again in a moment.</p>';
    }
  }
  $('pv-v-render').onclick = function () { view = 'render'; paintBody(); };
  $('pv-v-raw').onclick = function () { view = 'raw'; paintBody(); };
  $('pv-close').onclick = function () { $('pv').close(); };
  $('pv').addEventListener('click', function (e) { if (e.target === $('pv')) $('pv').close(); });   // backdrop
  $('pv').addEventListener('close', function () { open = null; setParam('t', ''); });
  $('pv-copy').onclick = async function () {
    if (!open || !open.markdown) return;
    try { await navigator.clipboard.writeText(open.markdown); toast('Copied to clipboard'); }
    catch (e) { toast('Copy failed - try the Markdown view'); }
  };
  $('pv-dl').onclick = function () {
    if (!open || !open.markdown) return;
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([open.markdown], { type: 'text/markdown;charset=utf-8' }));
    a.download = open.slug + '.md';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    toast('Downloaded ' + open.slug + '.md');
  };

  // --------------------------------------------------------------- boot
  $('q').value = params.get('q') || '';
  cat = params.get('category') === 'design' ? 'design' : 'md';
  fetch('/api/templates', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
    all = j.templates || [];
    var linked = params.get('t') && all.find(function (t) { return t.slug === params.get('t'); });
    if (linked && linked.group) cat = linked.group;   // a linked Design MD opens on its own shelf
    paintPills(); paint();
    if (params.get('t')) preview(params.get('t'));
  }).catch(function () {
    $('grid').innerHTML = '<div class="empty"><b>Templates could not be loaded.</b>Refresh to try again.</div>';
  });
})();
</script>
<script src="/nav.js"></script>
</body>
</html>
